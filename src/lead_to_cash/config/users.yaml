# =============================================================================
# RRPS Lead-to-Cash User Configuration
# =============================================================================
# This file defines users who can authenticate to the system.
#
# User Fields:
# - user_id: Unique identifier for the user
# - username: Login username
# - password_hash: bcrypt hashed password
# - first_name: User's first/given name (used for avatar initials)
# - last_name: User's last/family name
# - roles: List of RBAC roles (admin, sales_ops, financeops, viewer)
# - tenant_id: Multi-tenant identifier (default: "default")
# - status: Account status (active, inactive, suspended)
#
# Avatar Initials:
# The avatar displays initials derived from first_name.
# Example: first_name="Kian Seng" -> avatar shows "KS"
#
# To generate a new password hash:
#   python -c "from lead_to_cash.core.auth import AuthManager; print(AuthManager.hash_password('your_password'))"
#
# SECURITY:
# - Never commit plaintext passwords
# - Use strong passwords (12+ chars, mixed case, numbers, symbols)
# - Rotate passwords periodically
# =============================================================================

