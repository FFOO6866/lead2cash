        function formatOpportunityCards(answer, sources) {
            const _e = escapeHtml;
            // Parse opportunities from the LLM answer text
            const oppRegex = /(?:^|\n)(?:\d+\.\s*)?(?:\*\*)?([^*\n]+?)(?:\*\*)?[\n\r]+\s*[-•]?\s*(?:\*\*)?(?:ID|Opportunity ID)[:\s]*(?:\*\*)?[\s]*(300\d{7})/gm;
            const fieldRegex = /[-•]\s*(?:\*\*)?([^:*]+?)(?:\*\*)?:\s*(.+)/g;

            // Split by opportunity ID pattern
            const sections = answer.split(/(3000\d{6})/);
            const opps = [];

            // Parse each opportunity block
            const lines = answer.split('\n');
            let currentOpp = null;
            for (const line of lines) {
                const trimmed = line.trim();
                // Detect opp ID
                const idMatch = trimmed.match(/(?:ID|Opportunity ID)[:\s]*(300\d{7})/);
                if (idMatch) {
                    if (currentOpp) opps.push(currentOpp);
                    currentOpp = { id: idMatch[1], fields: {} };
                    continue;
                }
                if (!currentOpp) continue;

                // Parse field lines
                const fieldMatch = trimmed.match(/^[-•*]*\s*\*?\*?([^:*]+?)\*?\*?:\s*(.+)/);
                if (fieldMatch) {
                    const key = fieldMatch[1].trim().replace(/\*\*/g, '');
                    const val = fieldMatch[2].trim().replace(/\*\*/g, '');
                    currentOpp.fields[key] = val;
                }
            }
            if (currentOpp) opps.push(currentOpp);

            if (opps.length === 0) {
                // Fallback: return formatted text
                return `<div class="message agent"><div class="message-content">${formatContent(answer, sources)}</div></div>`;
            }

            // Count by status
            const won = opps.filter(o => (o.fields['Status'] || '').includes('Won')).length;
            const open = opps.filter(o => (o.fields['Status'] || '').includes('Open')).length;
            const lost = opps.filter(o => (o.fields['Status'] || '').includes('Lost')).length;

            let cardsHtml = opps.map(o => {
                const status = o.fields['Status'] || 'Unknown';
                const statusClass = status === 'Won' ? 'opp-won' : status === 'Lost' ? 'opp-lost' : 'opp-open';
                const value = o.fields['Value'] || '';
                const prob = o.fields['Win Probability'] || '';
                const salesType = o.fields['Sales Type'] || '';
                const closeDate = o.fields['Expected Close'] || o.fields['Expected Close Date'] || '';
                const startDate = o.fields['Start Date'] || '';
                const sapOrder = o.fields['SAP Order'] || '';
                const title = o.fields['title'] || '';

                return `
                <div class="opp-card ${statusClass}">
                    <div class="opp-card-header">
                        <div class="opp-id">${_e(o.id)}</div>
                        <span class="opp-status-badge ${statusClass}">${_e(status)}</span>
                    </div>
                    <div class="opp-card-body">
                        <div class="opp-value">${_e(value)}</div>
                        <div class="opp-fields">
                            <div class="opp-field"><span class="opp-label">Probability</span><span>${_e(prob)}</span></div>
                            <div class="opp-field"><span class="opp-label">Type</span><span>${_e(salesType)}</span></div>
                            <div class="opp-field"><span class="opp-label">Close</span><span>${_e(closeDate)}</span></div>
                            <div class="opp-field"><span class="opp-label">Start</span><span>${_e(startDate)}</span></div>
                            ${sapOrder ? `<div class="opp-field opp-sap-link"><span class="opp-label">SAP Order</span><span class="opp-sap-order" onclick="messageInput.value='Show order details for ${_e(sapOrder)}'; sendMessage();" style="cursor:pointer; color:var(--rrps-accent); text-decoration:underline;">${_e(sapOrder)}</span></div>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');

            // Sources
            const srcHtml = sources.map((s, i) => {
                try {
                    if (s.startsWith('http')) {
                        const domain = new URL(s).hostname.replace('www.', '');
                        return `<a href="${encodeURI(s)}" target="_blank" class="source-link">[${i+1}] ${_e(domain)}</a>`;
                    }
                    return `<span class="source-link source-internal">[${i+1}] ${_e(s)}</span>`;
                } catch(e) { return `<span class="source-link source-internal">[${i+1}] ${_e(s)}</span>`; }
            }).join('');

            return `
            <div class="opp-report">
                <div class="opp-report-header">
                    <div class="opp-report-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                        CEC Opportunities
                    </div>
                    <div class="opp-summary-badges">
                        ${won ? `<span class="opp-badge opp-won">${won} Won</span>` : ''}
                        ${open ? `<span class="opp-badge opp-open">${open} Open</span>` : ''}
                        ${lost ? `<span class="opp-badge opp-lost">${lost} Lost</span>` : ''}

        function formatCurrency(amount, currency = 'EUR') {
            // Supported ISO 4217 currency codes
            const supportedCurrencies = new Set([
                'SGD', 'USD', 'EUR', 'IDR', 'MYR', 'GBP', 'AUD', 'DKK',
                'JPY', 'CNY', 'KRW', 'THB', 'PHP', 'VND', 'INR', 'CHF'
            ]);

            // Validate and fallback to EUR if unsupported
            const curr = supportedCurrencies.has(currency) ? currency : 'EUR';

            try {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: curr,
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(amount);
            } catch (e) {
                // Fallback for any Intl formatting errors
                console.warn(`Currency formatting failed for ${currency}:`, e);
                return `${curr} ${amount.toLocaleString()}`;
            }
        }

        // HTML escaping utility to prevent XSS
        function handleAuthError(response) {
            if (response && response.status === 401) {
                window.location.href = '/login';

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // KYP Report Formatter - renders comprehensive due diligence reports
        function formatKYPReport(report) {
            const statusClass = getKYPStatusClass(report.overall_status);

            let html = `
                <div class="kyp-report">
                    <div class="kyp-header">
                        <div>
                            <div class="kyp-entity">${escapeHtml(report.entity_name)}</div>

                        </div>
                        <span class="kyp-status-badge ${statusClass}">${escapeHtml(report.overall_status)}</span>
                    </div>
            `;

            // Render each section
            if (report.sections && report.sections.length > 0) {
                for (const section of report.sections) {
                    html += formatKYPSection(section);
                }
            }

            // Assessment Summary
            if (report.assessment && report.assessment.summary) {
                html += `
                    <div class="kyp-assessment">
                        <div class="kyp-assessment-title">📋 Assessment Summary</div>
                        <div class="kyp-assessment-grid">
                `;
                for (const item of report.assessment.summary) {
                    const statusColor = getAssessmentStatusColor(item.status);
                    html += `
                        <div class="kyp-assessment-row">
                            <span class="kyp-assessment-category">${escapeHtml(item.category)}</span>
                            <span class="kyp-assessment-status" style="color: ${statusColor}">
                                ${getStatusIcon(item.status)} ${escapeHtml(formatStatusLabel(item.status))}
                            </span>
                            <span class="kyp-assessment-notes">${escapeHtml(item.notes)}</span>
                        </div>
                    `;
                }
                html += `</div></div>`;
            }

            // Recommendation
            if (report.recommendation) {
                const decisionRaw = report.recommendation.decision;
                const decisionMap = {
                    'PROCEED': 'proceed',
                    'PROCEED WITH CAUTION': 'conditional',
                    'DO NOT PROCEED': 'blocked',
                    'PENDING REVIEW': 'pending',
                    'PENDING_REVIEW': 'pending'
                };
                const decisionClass = decisionMap[decisionRaw] || decisionRaw.toLowerCase().replace(/\s+/g, '-');
                html += `
                    <div class="kyp-recommendation">
                        <div class="kyp-recommendation-decision ${decisionClass}">
                            ${getDecisionIcon(decisionRaw)} ${escapeHtml(decisionRaw)}
                        </div>
                        <div class="kyp-recommendation-text">${escapeHtml(report.recommendation.text)}</div>
                    </div>
                `;
            }

            // Issues
            if (report.issues && report.issues.length > 0) {
                html += `<div class="kyp-issues"><div class="kyp-issues-title">⚠️ Issues:</div><ul>`;
                report.issues.forEach(issue => { html += `<li>${escapeHtml(issue)}</li>`; });
                html += `</ul></div>`;
            }

            // Conditions
            if (report.conditions && report.conditions.length > 0) {
                html += `<div class="kyp-conditions"><div class="kyp-conditions-title">📌 Conditions:</div><ul>`;
                report.conditions.forEach(cond => { html += `<li>${escapeHtml(cond)}</li>`; });
                html += `</ul></div>`;
            }

            html += `</div>`;
            return html;
        }

        function formatStatusLabel(status) {
            const labels = {
                'NO_ADVERSE_FINDINGS': 'No Adverse Findings',
                'ADVERSE_FINDINGS': 'Adverse Findings',
                'REVIEW PENDING': 'Review Pending',
                'UNABLE_TO_VERIFY': 'Review Pending',
                'INFO': 'Info',
                'PASSED': 'No Adverse Findings',

        function formatKYPSection(section) {
            const statusClass = section.status.toLowerCase().replace(/\s+/g, '-');
            let html = `
                <div class="kyp-section status-${statusClass}">
                    <div class="kyp-section-header">
                        <span class="kyp-section-title">
                            <span class="icon">${escapeHtml(section.icon)}</span>${escapeHtml(section.title)}
                        </span>

                    </div>
            `;

            // Regular fields
            if (section.fields && section.fields.length > 0) {
                html += `<div class="kyp-fields">`;
                for (const field of section.fields) {
                    html += formatKYPField(field);
                }
                html += `</div>`;
            }

            // Sanctions checks
            if (section.checks && section.checks.length > 0) {
                html += `<div class="kyp-checks">`;
                for (const check of section.checks) {
                    html += `
                        <div class="kyp-check">
                            <span class="kyp-check-db">${escapeHtml(check.database)}</span>
                            <span class="kyp-check-result ${escapeHtml(check.status)}">${escapeHtml(check.result)}</span>
                        </div>
                    `;
                }
                html += `</div>`;
                if (section.checked_date) {
                    html += `<div class="kyp-source">Checked: ${escapeHtml(section.checked_date)}</div>`;
                }
            }

            // Litigation findings
            if (section.findings && section.findings.length > 0) {
                for (const finding of section.findings) {
                    const findingStatus = finding.status.toLowerCase();
                    html += `
                        <div class="kyp-finding">

                            <div class="kyp-finding-details">${escapeHtml(finding.details)}</div>

                            ${finding.resolution_date ? ` (${escapeHtml(finding.resolution_date)})` : ''}
                        </div>
                    `;
                }
            }

            // Subsections (e.g., Ownership)
            if (section.subsections && section.subsections.length > 0) {
                for (const sub of section.subsections) {
                    html += `
                        <div class="kyp-subsection">
                            <div class="kyp-subsection-title">${escapeHtml(sub.title)}</div>
                            <div class="kyp-fields">

            // Source attribution
            if (section.source) {
                html += `<div class="kyp-source">Source: ${escapeHtml(section.source)}</div>`;
            }

            html += `</div>`;
            return html;
        }

        function formatKYPField(field) {
            let valueHtml = escapeHtml(field.value);

            // Paragraph type: full-width text block, no label-value split
            if (field.type === 'paragraph') {
                return `
                    <div class="kyp-field-paragraph">${valueHtml}</div>
                `;
            }

            // Handle different field types
            if (field.type === 'status' && field.status) {
                valueHtml = `<span class="kyp-field-status ${escapeHtml(field.status)}">${escapeHtml(field.value)}</span>`;
            } else if (field.type === 'link') {
                const rawUrl = String(field.value || '');
                // Only allow http/https URLs to prevent javascript: injection
                const safeUrl = (rawUrl.startsWith('http://') || rawUrl.startsWith('https://'))
                    ? encodeURI(rawUrl)
                    : 'https://' + encodeURI(rawUrl);
                valueHtml = `<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer" style="color: var(--rrps-accent);">${escapeHtml(field.value)}</a>`;
            }

            // Add badge if present
            if (field.badge) {
                valueHtml += `<span class="kyp-field-badge">${escapeHtml(field.badge)}</span>`;
            }

            return `
                <div class="kyp-field">
                    <span class="kyp-field-label">${escapeHtml(field.label)}</span>
                    <span class="kyp-field-value">${valueHtml}</span>
                </div>

        }

        async function selectEntity(index) {
            const candidates = window.pendingEntityCandidates || [];
            if (index < 0 || index >= candidates.length) {
                console.error('Invalid entity index:', index);
                return;
            }

            const selected = candidates[index];
            const query = pendingEntityQuery || 'Show billing items';

            // Visual feedback
            document.querySelectorAll('.entity-candidate').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });

            // Add user message showing selection
            addMessage(`Selected: ${selected.name}`, true);

            // Resend the query with confirmed entity
            showTyping();
            const statusDot = document.querySelector('.status-dot');
            const statusText = document.querySelector('.status-text');

            try {
                const requestBody = {
                    message: query,
                    session_id: sessionId,
                    confirmed_entity: {
                        customer_id: selected.customer_id,
                        customer_name: selected.name
                    }
                };
                // Include original task type if available (to avoid re-interpretation)
                if (pendingOriginalTaskType) {
                    requestBody.original_task_type = pendingOriginalTaskType;
                }

                const response = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(requestBody)
                });

                hideTyping();

                if (handleAuthError(response)) return;
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Process the response (same handling as sendMessage)
                if (data.type === 'credit_report') {
                    const creditHtml = formatCreditReport(data);
                    addValidationMessage(creditHtml);
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'kyp_report') {
                    const htmlContent = formatKYPReport(data);
                    addValidationMessage(htmlContent);
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'finops_report' || isFinOpsResponse(data.data || data)) {
                    const reportData = data.data || data;
                    const reportHtml = formatFinOpsReport(reportData);
                    addValidationMessage(reportHtml);
                } else if (data.type === 'order_detail') {
                    const orderHtml = formatOrderDetailCard(data.order, data.sources || []);
                    addValidationMessage(orderHtml);
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'opportunity_report') {
                    const oppHtml = formatOpportunityCardsFromData(data);
                    addValidationMessage(oppHtml);
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'answer') {
                    const answer = data.answer || 'I processed your request.';
                    const sources = data.sources || [];
                    addMessage(answer, false, sources);

                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'error') {
                    addMessage(`Error: ${data.error || 'Unknown error occurred'}`, false);
                } else if (data.response) {
                    addMessage(data.response, false);
                } else if (data.message) {
                    addMessage(data.message, false);
                } else {
                    addMessage('Request processed successfully.', false);
                }

                // Clear pending data
                window.pendingEntityCandidates = null;
                pendingEntityQuery = '';
                pendingOriginalTaskType = '';

            } catch (error) {
                hideTyping();
                console.error('Entity selection error:', error);
                addMessage('Error processing selection. Please try again.', false);
            }
        }

        /* =================================================================
           Credit Report Card — structured SAP credit data
           ================================================================= */
        function formatCreditReport(data) {
            const c = data.credit || {};
            const _e = escapeHtml;
            const currency = _e(c.currency || 'SGD');
            const fmt = (v) => parseFloat(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const util = parseFloat(c.utilization || 0);
            const isBlocked = (c.status || '').toUpperCase() === 'BLOCKED';
            const statusClass = isBlocked ? 'blocked' : 'approved';
            const statusLabel = isBlocked ? 'BLOCKED' : 'APPROVED';

            // Meter color: green < 50%, yellow 50-80%, orange 80-100%, red > 100%
            let meterColor = '#34d399';
            if (util > 100) meterColor = '#f87171';
            else if (util > 80) meterColor = '#f59e0b';
            else if (util > 50) meterColor = '#fbbf24';
            const meterWidth = Math.min(util, 100);

            const uen = c.uen ? `<div class="credit-hero-id">UEN: ${_e(c.uen)}</div>` : '';

            let html = `
            <div class="credit-report">
                <div class="credit-report-header">
                    <div class="credit-report-title">SAP Credit Status</div>
                    <span class="credit-status-badge ${statusClass}">${statusLabel}</span>
                </div>
                <div class="credit-hero">
                    <div class="credit-hero-name">${_e(c.customer_name || 'Unknown')}</div>
                    <div class="credit-hero-id">Customer ID: ${_e(c.customer_id || '')} · Credit Control Area: ${_e(c.credit_control_area || '1000')}</div>
                    ${uen}
                </div>
                <div class="credit-fields">
                    <div class="credit-field">
                        <label>Credit Limit</label>
                        <div class="value">${currency} ${fmt(c.credit_limit)}</div>
                    </div>
                    <div class="credit-field">
                        <label>Credit Exposure</label>
                        <div class="value">${currency} ${fmt(c.credit_exposure)}</div>
                    </div>
                    <div class="credit-field">
                        <label>Available Credit</label>
                        <div class="value" style="color: ${isBlocked ? '#f87171' : '#34d399'}">${currency} ${fmt(c.available_credit)}</div>
                    </div>
                    <div class="credit-field">
                        <label>Utilization</label>
                        <div class="value" style="color: ${meterColor}">${util.toFixed(1)}%</div>
                    </div>
                </div>
                <div class="credit-meter">
                    <div class="credit-meter-fill" style="width: ${meterWidth}%; background: ${meterColor};"></div>
                </div>
                <div class="credit-meter-label">
                    <span>0%</span>
                    <span>${util.toFixed(1)}% utilization</span>
                    <span>100%</span>
                </div>
                <div class="finops-source">Source: SAP CPI (MS5) • Updated: ${new Date().toLocaleTimeString()}</div>
            </div>`;

            return html;
        }

        /* =================================================================
           Finance Ops Report Formatter - Billing & Collections Dashboard
           ================================================================= */
        function formatFinOpsReport(data) {
            // Determine report type from task_type FIRST, then fall back to data content
            // IMPORTANT: Check explicit task_type before checking for data presence
            let reportType = data.report_type || 'billing';
            if (data.task_type === 'aging_analysis') {
                reportType = 'aging';
            } else if (data.task_type === 'collections_items' || data.task_type === 'downpayment_overdue') {
                reportType = 'collections';
            } else if (data.task_type === 'billing_items' || data.task_type === 'downpayment_alerts') {
                reportType = 'billing';
            } else if (data.task_type === 'payment_status') {
                reportType = 'payment_status';
            } else if (data.collections_items && !data.billing_items) {
                // Fallback to content-based detection only if no explicit task_type
                reportType = 'collections';
            } else if (data.billing_items) {
                reportType = 'billing';
            }

            // Extract items from various data formats (must be before customerName extraction)
            const items = data.items ||
                          data.billing_items ||
                          data.collections_items ||
                          [];

            // Extract customer name if filtered
            const customerName = items.length > 0 && items[0].customer_name ? items[0].customer_name : null;
            const customerSuffix = customerName && data.customer_filtered ? ` - ${customerName}` : '';

            const isDP = data.task_type === 'downpayment_alerts' || data.task_type === 'downpayment_overdue';
            const title = reportType === 'payment_status' ? 'Payment Status' + customerSuffix :
                          isDP && reportType === 'collections' ? 'Overdue Downpayments' + customerSuffix :
                          isDP ? 'Downpayment Alerts' + customerSuffix :
                          reportType === 'collections' ? 'Pending Collections' + customerSuffix :
                          reportType === 'aging' ? 'Aging Analysis' + customerSuffix :
                          'Pending Billing' + customerSuffix;

            // Extract aging buckets - only show for collections/aging, not billing
            const showAging = reportType === 'collections' || reportType === 'aging';
            const aging = showAging ? (data.aging || data.aging_buckets || null) : null;

            // Extract or calculate summary
            const overdueItems = items.filter(i => i.status === 'OVERDUE' || (i.days_to_action && i.days_to_action < 0));
            const summary = data.summary || {
                total_count: items.length,
                overdue_count: overdueItems.length
            };

            let html = `
                <div class="finops-report">
                    <div class="finops-header">
                        <div>
                            <div class="finops-title">${title}</div>
                            <div class="finops-subtitle">Today: ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
                        </div>
                        <div class="finops-summary-badge">
                            <div class="finops-metric">
                                <div class="finops-metric-value">${summary.total_count || items.length}</div>
                                <div class="finops-metric-label">Milestones</div>
                            </div>
                        </div>
                    </div>
            `;

            // Aging buckets — skip for collections (embedded in group headers)
            if (aging && reportType !== 'collections') {
                html += formatFinOpsAgingBuckets(aging);
            }

            // Group toggle (only for collections — not billing or payment_status)
            const showGroupToggle = reportType === 'collections' && items.length > 0;
            if (showGroupToggle) {
                const toggleId = `finops-group-toggle-${Date.now()}`;
                html += `
                    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 4px 16px 0;">
                        <button class="finops-expand-all-btn" onclick="finopsExpandCollapseAll(this)">Expand All</button>
                        <div class="finops-group-toggle" id="${toggleId}" style="display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); font-size: 11px;">
                            <button class="finops-toggle-btn active" data-mode="urgency" onclick="finopsToggleGroup(this,'${toggleId}')">By Aging</button>
                            <button class="finops-toggle-btn" data-mode="customer" onclick="finopsToggleGroup(this,'${toggleId}')">By Customer</button>
                        </div>
                    </div>
                `;
            }

            // Sort helper used by all views
            const sortByDays = (a, b) => (a.days_until_due ?? a.days_to_action ?? 0) - (b.days_until_due ?? b.days_to_action ?? 0);

            if (items.length > 0 && reportType === 'collections') {
                // ============================================================
                // COLLECTIONS: By Aging view + By Customer view
                // ============================================================

                // --- BY AGING VIEW (default) ---
                // Group items by aging bucket based on days_until_due
                const agingGroups = { aged45: [], aged30: [], aged0: [], current: [] };
                for (const item of items) {
                    const days = item.days_until_due ?? item.days_to_action ?? 0;
                    if (days < -45)      agingGroups.aged45.push(item);
                    else if (days < -30) agingGroups.aged30.push(item);
                    else if (days < 0)   agingGroups.aged0.push(item);
                    else                 agingGroups.current.push(item);
                }
                Object.values(agingGroups).forEach(g => g.sort(sortByDays));

                const agingDefs = [
                    { key: 'aged45',  label: '45+ Days Overdue',  color: 'var(--error)',   items: agingGroups.aged45 },
                    { key: 'aged30',  label: '30-45 Days Overdue', color: '#ea580c',        items: agingGroups.aged30 },
                    { key: 'aged0',   label: '0-30 Days Overdue',  color: 'var(--warning)', items: agingGroups.aged0 },
                    { key: 'current', label: 'Current',            color: 'var(--success)', items: agingGroups.current },
                ];

                let urgencyHtml = '';
                for (const group of agingDefs) {
                    if (group.items.length === 0) continue;
                    const groupTotal = group.items.reduce((sum, i) => sum + (parseFloat(i.milestone_amount || i.total_amount || 0)), 0);
                    const groupCurrencies = [...new Set(group.items.map(i => i.order_currency || i.currency || 'EUR'))];
                    const groupAmtStr = groupCurrencies.length === 1
                        ? `${groupCurrencies[0]} ${groupTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`
                        : group.items.length + ' items';

                    const agingGrpId = `finops-grp-${group.key}-${Date.now()}`;
                    urgencyHtml += `
                        <div class="finops-timeline-group">
                            <div class="finops-timeline-header" style="border-left: 4px solid ${group.color}; background: rgba(255,255,255,0.06); padding: 10px 14px; cursor: pointer;" onclick="
                                var el=document.getElementById('${agingGrpId}');
                                if(el){var h=el.style.display==='none';el.style.display=h?'block':'none';
                                var btn=el.nextElementSibling;if(btn&&btn.classList.contains('finops-show-toggle'))btn.textContent=h?'Hide':'Show ${group.items.length} items';}
                            ">
                                <div>
                                    <div style="font-weight: 600; font-size: 12px; letter-spacing: 0.3px; text-transform: uppercase; color: var(--text-secondary);">${group.label} (${group.items.length})</div>
                                </div>
                                <div style="font-size: 18px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums;">${groupAmtStr}</div>
                            </div>
                            <div id="${agingGrpId}" style="display:none;">
                                ${group.items.map(i => formatFinOpsItem(i)).join('')}
                            </div>
                            <button class="finops-show-toggle" data-expand-label="Show ${group.items.length} items" onclick="
                                var el=document.getElementById('${agingGrpId}');
                                var h=el.style.display==='none';
                                el.style.display=h?'block':'none';
                                this.textContent=h?'Hide':'Show ${group.items.length} items';
                            ">Show ${group.items.length} items</button>
                        </div>
                    `;
                }

                // --- BY CUSTOMER VIEW ---
                // Headers only by default; all items hidden until expanded
                let customerHtml = '';
                const custMap = {};
                for (const item of items) {
                    const cName = item.customer_name || 'Unknown';
                    if (!custMap[cName]) custMap[cName] = [];
                    custMap[cName].push(item);
                }
                const custEntries = Object.entries(custMap).sort((a, b) => {
                    const totalA = a[1].reduce((s, i) => s + parseFloat(i.milestone_amount || i.total_amount || 0), 0);
                    const totalB = b[1].reduce((s, i) => s + parseFloat(i.milestone_amount || i.total_amount || 0), 0);
                    return totalB - totalA;
                });
                for (const [cust, custItems] of custEntries) {
                    custItems.sort(sortByDays);
                    const custTotal = custItems.reduce((s, i) => s + parseFloat(i.milestone_amount || i.total_amount || 0), 0);
                    const custCurrencies = [...new Set(custItems.map(i => i.order_currency || i.currency || 'EUR'))];
                    const custAmtStr = custCurrencies.length === 1
                        ? `${custCurrencies[0]} ${custTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`
                        : custItems.length + ' items';
                    const hasOverdue = custItems.some(i => (i.days_until_due ?? i.days_to_action ?? 0) < 0);
                    const borderColor = hasOverdue ? 'var(--error)' : 'var(--info)';
                    const custGrpId = `finops-cust-${escapeHtml(cust).replace(/\s+/g,'-')}-${Date.now()}`;

                    customerHtml += `
                        <div class="finops-timeline-group">
                            <div class="finops-timeline-header" style="border-left: 4px solid ${borderColor}; background: rgba(255,255,255,0.06); padding: 10px 14px; cursor: pointer;" onclick="
                                var el=document.getElementById('${custGrpId}');
                                if(el){var h=el.style.display==='none';el.style.display=h?'block':'none';
                                var btn=el.nextElementSibling;if(btn&&btn.classList.contains('finops-show-toggle'))btn.textContent=h?'Hide':'Show ${custItems.length} items';}
                            ">
                                <div>
                                    <div style="font-weight: 600; font-size: 12px; letter-spacing: 0.3px; text-transform: uppercase; color: var(--text-secondary);">${escapeHtml(cust)} (${custItems.length})</div>
                                </div>
                                <div style="font-size: 18px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums;">${custAmtStr}</div>
                            </div>
                            <div id="${custGrpId}" style="display:none;">
                                ${custItems.map(i => formatFinOpsItem(i)).join('')}
                            </div>
                            <button class="finops-show-toggle" data-expand-label="Show ${custItems.length} items" onclick="
                                var el=document.getElementById('${custGrpId}');
                                var h=el.style.display==='none';
                                el.style.display=h?'block':'none';
                                this.textContent=h?'Hide':'Show ${custItems.length} items';
                            ">Show ${custItems.length} items</button>
                        </div>
                    `;
                }

                html += `<div class="finops-items finops-view-urgency">${urgencyHtml}</div>`;
                html += `<div class="finops-items finops-view-customer" style="display:none;">${customerHtml}</div>`;

            } else if (items.length > 0) {
                // ============================================================
                // NON-COLLECTIONS: Urgency grouping (billing, payment_status)
                // ============================================================
                const groups = { overdue: [], blocked: [], thisWeek: [], thisMonth: [], billedUnpaid: [], upcoming: [], paid: [] };
                for (const item of items) {
                    const state = item.state || '';
                    const days = item.days_until_due ?? item.days_to_action ?? 0;
                    const status = item.status || '';
                    if (state === 'OVERDUE' || (!state && (days < 0 || status === 'OVERDUE'))) {
                        groups.overdue.push(item);
                    } else if (state === 'BLOCKED') {
                        groups.blocked.push(item);
                    } else if (state === 'DUE_THIS_WEEK' || (!state && days >= 0 && days <= 7)) {
                        groups.thisWeek.push(item);
                    } else if (state === 'DUE_THIS_MONTH' || (!state && days > 7 && days <= 30)) {
                        groups.thisMonth.push(item);
                    } else if (state === 'BILLED_UNPAID') {
                        groups.billedUnpaid.push(item);
                    } else if (state === 'BILLED_PAID' || status === 'PAID') {
                        groups.paid.push(item);
                    } else {
                        groups.upcoming.push(item);
                    }
                }
                groups.overdue.sort(sortByDays);
                groups.thisWeek.sort(sortByDays);
                groups.thisMonth.sort(sortByDays);

                const groupDefs = [
                    { key: 'overdue',      label: 'Overdue',          action: 'Create billing document immediately', color: 'var(--error)',   items: groups.overdue },
                    { key: 'blocked',      label: 'Blocked',          action: 'Investigate billing block',           color: '#9333ea',        items: groups.blocked },
                    { key: 'thisWeek',     label: 'Due This Week',    action: null,                                  color: 'var(--warning)', items: groups.thisWeek },
                    { key: 'thisMonth',    label: 'Due This Month',   action: null,                                  color: 'var(--info)',    items: groups.thisMonth },
                    { key: 'billedUnpaid', label: 'Awaiting Payment', action: 'Follow up with customer',             color: '#D97706',        items: groups.billedUnpaid },
                    { key: 'upcoming',     label: 'Upcoming',         action: null,                                  color: 'var(--success)', items: groups.upcoming },
                ];
                if (reportType === 'payment_status') {
                    groupDefs.push({ key: 'paid', label: 'Settled', action: null, color: 'var(--success)', items: groups.paid });
                }

                let urgencyHtml = '';
                for (const group of groupDefs) {
                    if (group.items.length === 0) continue;
                    const groupTotal = group.items.reduce((sum, i) => sum + (parseFloat(i.milestone_amount || i.total_amount || 0)), 0);
                    const groupCurrencies = [...new Set(group.items.map(i => i.order_currency || i.currency || 'EUR'))];
                    const groupAmtStr = groupCurrencies.length === 1
                        ? `${groupCurrencies[0]} ${groupTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`
                        : group.items.length + ' items';
                    const showAction = group.key === 'blocked' && group.action;

                    urgencyHtml += `
                        <div class="finops-timeline-group">
                            <div class="finops-timeline-header" style="border-left: 4px solid ${group.color}; background: rgba(255,255,255,0.06); padding: 10px 14px;">
                                <div>
                                    <div style="font-weight: 600; font-size: 12px; letter-spacing: 0.3px; text-transform: uppercase; color: var(--text-secondary);">${group.label} (${group.items.length})</div>
                                    ${showAction ? `<div style="font-size: 11px; color: var(--text-muted, #888); margin-top: 2px;">${group.action}</div>` : ''}
                                </div>
                                <div style="font-size: 18px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums;">${groupAmtStr}</div>
                            </div>
                    `;

                    const COLLAPSE_THRESHOLD = 5;
                    const VISIBLE_COUNT = 3;
                    const shouldCollapse = group.items.length > COLLAPSE_THRESHOLD;
                    const visibleItems = shouldCollapse ? group.items.slice(0, VISIBLE_COUNT) : group.items;
                    const hiddenItems = shouldCollapse ? group.items.slice(VISIBLE_COUNT) : [];

                    for (const item of visibleItems) {
                        urgencyHtml += formatFinOpsItem(item);
                    }
                    if (shouldCollapse) {
                        const groupId = `finops-grp-${group.key}-${Date.now()}`;
                        urgencyHtml += `
                            <div id="${groupId}" style="display:none;">
                                ${hiddenItems.map(i => formatFinOpsItem(i)).join('')}
                            </div>
                            <button class="finops-show-toggle" data-expand-label="Show all ${group.items.length} items" onclick="
                                var el=document.getElementById('${groupId}');
                                var h=el.style.display==='none';
                                el.style.display=h?'block':'none';
                                this.textContent=h?'Show fewer':'Show all ${group.items.length} items';
                            ">Show all ${group.items.length} items</button>
                        `;
                    }
                    urgencyHtml += `</div>`;
                }

                html += `<div class="finops-items finops-view-urgency">${urgencyHtml}</div>`;
            }

            if (items.length > 0) {
                // Payment status summary bar (for payment_status view)
                if (reportType === 'payment_status' && data.payment_summary) {
                    const ps = data.payment_summary;
                    const dpPaid = parseFloat(ps.downpayment_paid) || 0;
                    const dpPending = parseFloat(ps.downpayment_pending) || 0;
                    const invPaid = parseFloat(ps.invoice_paid) || 0;
                    const invPending = parseFloat(ps.invoice_pending) || 0;
                    const curr = ps.currency || 'EUR';
                    html += `
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; background: rgba(255,255,255,0.03); border-radius: 8px; margin: 8px 16px;">
                            <div>
                                <div style="font-size: 11px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px;">Downpayments</div>
                                <div style="font-size: 13px;"><span style="color: var(--success);">Paid: ${curr} ${dpPaid.toLocaleString('en-US', {minimumFractionDigits:2})}</span></div>
                                <div style="font-size: 13px;"><span style="color: var(--warning);">Pending: ${curr} ${dpPending.toLocaleString('en-US', {minimumFractionDigits:2})}</span></div>
                            </div>
                            <div>
                                <div style="font-size: 11px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px;">Invoices</div>
                                <div style="font-size: 13px;"><span style="color: var(--success);">Paid: ${curr} ${invPaid.toLocaleString('en-US', {minimumFractionDigits:2})}</span></div>
                                <div style="font-size: 13px;"><span style="color: var(--warning);">Pending: ${curr} ${invPending.toLocaleString('en-US', {minimumFractionDigits:2})}</span></div>
                            </div>
                        </div>
                    `;
                }

                // Total amount - group by currency (handle both MilestoneAlert + BillingItem)
                const actionableItems = items.filter(i => (i.state || i.status) !== 'BILLED_PAID' && (i.state || i.status) !== 'PAID');
                const totalsByCurrency = {};
                for (const item of actionableItems) {
                    const curr = item.order_currency || item.currency || 'EUR';
                    const amt = parseFloat(item.milestone_amount || item.total_amount || 0);
                    totalsByCurrency[curr] = (totalsByCurrency[curr] || 0) + amt;
                }

                if (Object.keys(totalsByCurrency).length > 0) {
                    const totalLines = Object.entries(totalsByCurrency)
                        .map(([curr, amt]) => `${curr} ${amt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`)
                        .join(' + ');

                    html += `
                        <div class="finops-summary-footer">
                            <div class="finops-total">
                                Total ${reportType === 'billing' ? 'Pending' : 'Outstanding'}:
                                <span class="finops-total-amount">${totalLines}</span>
                            </div>
                        </div>
                    `;
                }
            } else {
                const emptyLabels = {
                    'aging': 'aging', 'collections': 'collections', 'billing': 'billing',
                    'payment_status': 'payment', 'downpayment_alerts': 'downpayment', 'downpayment_overdue': 'overdue downpayment'
                };
                const emptyMessage = emptyLabels[data.task_type] || emptyLabels[reportType] || 'billing';
                html += `
                    <div class="finops-items">
                        <div style="text-align: center; padding: 30px; color: var(--text-secondary);">
                            ✅ No pending ${emptyMessage} items
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="finops-source">Source: SAP Sales Orders (Simulator) • Updated: ${new Date().toLocaleTimeString()}</div>
            </div>`;

            return html;
        }

        function formatFinOpsAgingBuckets(aging) {
            // 4 aging buckets: Current (green), 0-30 days (amber), 30-45 days (orange), 45+ days (red)
            const buckets = [
                { key: 'CURRENT', label: 'Current', class: 'current' },
                { key: '0-30', label: '0-30 Days', class: 'days-0-30' },
                { key: '30-45', label: '30-45 Days', class: 'days-30-45' },
                { key: '45+', label: '45+ Days', class: 'days-45-plus' }
            ];

            let html = `
                <div class="finops-aging">
                    <div class="finops-aging-title">📊 Aging Analysis</div>
                    <div class="finops-aging-buckets">
            `;

            for (const bucket of buckets) {
                const data = aging[bucket.key] || { count: 0, amount: 0 };
                const currency = aging.currency || 'EUR';
                html += `
                    <div class="finops-bucket ${bucket.class}">
                        <div class="finops-bucket-count">${data.count || 0}</div>
                        <div class="finops-bucket-amount">${currency} ${(data.amount || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</div>
                        <div class="finops-bucket-label">${bucket.label}</div>
                    </div>
                `;
            }

            html += `</div></div>`;
            return html;
        }

        function formatFinOpsItem(item) {
            // Support both MilestoneAlert (billing brain) and BillingItem (legacy) formats
            const isMilestoneAlert = !!item.milestone_desc;
            const daysToAction = item.days_until_due ?? item.days_to_action ?? 0;
            const daysOverdue = daysToAction < 0 ? Math.abs(daysToAction) : 0;
            const itemState = item.state || item.status || '';
            const statusInfo = isMilestoneAlert
                ? getMilestoneStatusInfo(itemState, daysOverdue)
                : getFinOpsStatusInfo(itemState, daysOverdue);
            // DP badge removed — milestone_desc already says "Down payment ..."

            // Amount and currency — handle both MilestoneAlert and BillingItem
            const amount = parseFloat(item.milestone_amount || item.total_amount || 0);
            const currency = item.order_currency || item.currency || 'EUR';
            const pct = item.milestone_pct ? `${item.milestone_pct}%` : '';

            // Order + description
            const orderNum = item.order_number || item.sales_order || '';
            const desc = item.milestone_desc || item.document_number || '';

            // Due date — prefer pre-formatted, fall back to ISO
            const dueDateFmt = item.milestone_date_fmt || item.milestone_date || item.due_date || item.document_date || '';

            // Status label — override billing brain's generic "Awaiting payment" for past-due items
            const statusLabel = (itemState === 'BILLED_UNPAID' && daysOverdue > 0)
                ? statusInfo.label
                : (item.urgency_label || statusInfo.label);

            // 2-row card: row 1 = customer + DP badge | amount, row 2 = order · desc | due date + status
            return `
                <div class="finops-item status-${statusInfo.class}">
                    <div class="finops-item-row">
                        <div class="finops-item-main">
                            <div class="finops-item-customer">${escapeHtml(item.customer_name || 'Unknown')}</div>
                            <div class="finops-item-doc">${orderNum ? '<a href="#" class="finops-order-link" onclick="event.preventDefault();messageInput.value=\'Show order details for ' + escapeHtml(orderNum) + '\';sendMessage();return false;">Order ' + escapeHtml(orderNum) + '</a> &middot; ' : ''}${escapeHtml(desc)}</div>
                        </div>
                        <div class="finops-item-right">
                            <div class="finops-item-amount">${escapeHtml(currency)} ${amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                            ${dueDateFmt ? `<div class="finops-item-due-inline">Due: ${escapeHtml(dueDateFmt)}</div>` : ''}
                            <span class="finops-item-status ${statusInfo.class}">${statusLabel}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function getFinOpsStatusInfo(status, daysOverdue) {
            // 4-level status based on days overdue (takes priority over status text)
            // RED: 45+ days overdue - escalation required
            // ORANGE: 30-45 days overdue - high priority
            // AMBER: 0-30 days overdue - at risk
            // GREEN/BLUE: Current (not overdue)

            // Check days first (takes priority)
            if (daysOverdue > 45) {
                return { class: 'overdue', label: 'OVERDUE 45+' };
            }
            else if (daysOverdue > 30) {
                return { class: 'overdue', label: 'OVERDUE 30-45' };
            }
            else if (daysOverdue > 0) {
                return { class: 'warning', label: 'AT RISK' };
            }
            // Partially paid always shows as warning (yellow)
            else if (status === 'PARTIALLY_PAID') {
                return { class: 'warning', label: 'PARTIAL' };
            }
            // GREEN/BLUE: Current status based on document type
            else if (status === 'PENDING_COLLECTION') {
                return { class: 'pending', label: 'PENDING' };
            } else if (status === 'PENDING_BILLING') {
                return { class: 'current', label: 'BILLING' };
            } else if (status === 'PAID') {
                return { class: 'current', label: 'PAID' };
            }
            return { class: 'pending', label: status || 'PENDING' };
        }

        function getMilestoneStatusInfo(state, daysOverdue) {
            // BILLED_UNPAID past due → overdue styling with days context
            if (state === 'BILLED_UNPAID' && daysOverdue > 0) {
                if (daysOverdue > 45) return { class: 'overdue', label: `${daysOverdue}d OVERDUE` };
                if (daysOverdue > 30) return { class: 'overdue', label: `${daysOverdue}d OVERDUE` };
                return { class: 'warning', label: `${daysOverdue}d PAST DUE` };
            }
            const map = {
                'OVERDUE': { class: 'overdue', label: 'OVERDUE' },
                'DUE_THIS_WEEK': { class: 'warning', label: 'DUE THIS WEEK' },
                'DUE_THIS_MONTH': { class: 'pending', label: 'DUE THIS MONTH' },
                'UPCOMING': { class: 'current', label: 'UPCOMING' },
                'BLOCKED': { class: 'overdue', label: 'BLOCKED' },
                'BILLED_UNPAID': { class: 'warning', label: 'AWAITING PAYMENT' },
                'BILLED_PAID': { class: 'current', label: 'SETTLED' },
            };
            return map[state] || { class: 'pending', label: state || 'PENDING' };
        }

        function finopsExpandCollapseAll(btn) {

        // Check if response is a FinOps report and format accordingly
        function isFinOpsResponse(data) {

        // Scroll the messages container so that `el` appears at the top of the viewport.
        // Uses getBoundingClientRect for reliability — immune to offsetParent chain issues.
        function scrollToTopOfElement(el) {
            const containerRect = messagesContainer.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            // How far el's top is from the container's visible top edge

        function addValidationMessage(htmlContent) {

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
