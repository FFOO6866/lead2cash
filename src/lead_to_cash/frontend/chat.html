<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Ops Agent | RRPS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙</text></svg>" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* RRPS Brand Colors - from Color Spectrum V.1.1 */
            /* Primary: RR Blue */
            --rrps-navy: #10107A;           /* RR Blue 100 */
            --rrps-navy-90: #1E1E8C;        /* RR Blue 90 */
            --rrps-dark: #0A0A52;           /* RR Blue darker */

            /* Secondary: Cobalt */
            --rrps-accent: #0066CC;         /* Cobalt 60 */
            --rrps-accent-light: #3399FF;  /* Cobalt 40 */

            /* Neutral: Grey */
            --rrps-silver: #6B7280;         /* Grey 60 - better contrast */
            --rrps-light: #F3F4F6;          /* Grey 10 */
            --rrps-grey-20: #E5E7EB;        /* Grey 20 */
            --rrps-grey-80: #1F2937;        /* Grey 80 */
            --white: #FFFFFF;

            /* Functional Colors - from RRPS Guidelines */
            --success: #059669;             /* Green 60 - darker for better contrast */
            --success-light: #D1FAE5;       /* Green 10 */
            --warning: #D97706;             /* Yellow 70 - darker for better contrast */
            --warning-light: #FEF3C7;       /* Yellow 10 */
            --error: #DC2626;               /* Red 60 */
            --error-light: #FEE2E2;         /* Red 10 */
            --info: #2563EB;                /* Cobalt 70 */
            --info-light: #DBEAFE;          /* Cobalt 10 */

            /* Text Colors - high contrast */
            --text-primary: #FFFFFF;
            --text-secondary: #D1D5DB;      /* Grey 30 - lighter for dark bg */
            --text-muted: #9CA3AF;          /* Grey 50 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--rrps-dark);
            color: var(--white);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--rrps-navy);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--white);
        }

        .logo span {
            color: var(--rrps-accent);
        }

        .title {
            font-size: 16px;
            font-weight: 500;
            color: var(--rrps-light);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--rrps-silver);
        }

        .status-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }

        .status-version {
            font-size: 9px;
            color: var(--rrps-silver);
            opacity: 0.7;
            letter-spacing: 0.3px;
        }

        .status-version:empty {
            display: none;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.offline { background: var(--error); }
        .status-dot.typing { background: var(--warning); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Header Right */
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* User Avatar */
        .avatar {
            width: 36px;
            height: 36px;
            background: var(--rrps-navy);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .avatar span {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Logout Button */
        .logout-btn {
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            padding: 4px;
            color: var(--rrps-silver);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn:hover {
            color: var(--error);
            background: rgba(220, 38, 38, 0.1);
        }

        .logout-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Main Container */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 0 16px;
        }

        /* Quick Actions */
        .quick-actions {
            padding: 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-btn {
            background: var(--white);
            border: 1px solid var(--rrps-silver);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--rrps-navy);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-btn:hover {
            background: var(--rrps-light);
            border-color: var(--rrps-accent);
        }

        .quick-btn:active {
            transform: scale(0.98);
        }

        /* Badge for count indicators */
        .quick-btn .badge {
            background: var(--rrps-accent);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 4px;
            min-width: 18px;
            text-align: center;
        }

        .quick-btn.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .quick-btn .badge.collections {
            background: #D97706;
        }

        .quick-btn .badge.overdue {
            background: #DC2626;
        }

        .quick-btn .badge.error {
            background: #6B7280;
            cursor: pointer;
        }

        .quick-btn .badge.neworders {
            background: #059669;
        }

        /* IPAS Order Entry - Inline Report Style (consistent with KYP) */
        .ipas-report {
            background: var(--rrps-grey-80);
            border-radius: 12px;
            padding: 20px;
            margin: 12px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .ipas-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ipas-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--rrps-accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ipas-count-badge {
            background: var(--success);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .ipas-orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ipas-order-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ipas-order-card:hover {
            border-color: var(--rrps-accent);
            background: rgba(0, 122, 204, 0.1);
        }

        .ipas-order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .ipas-order-id {
            font-weight: 600;
            color: var(--rrps-accent);
            font-size: 15px;
        }

        .ipas-order-file {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .ipas-order-value {
            font-weight: 600;
            color: var(--success);
            font-size: 15px;
        }

        .ipas-order-details {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .ipas-order-details span {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .ipas-empty {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
        }

        .ipas-empty svg {
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .ipas-view-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--rrps-accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .ipas-view-btn:hover {
            background: var(--rrps-accent-light);
        }

        /* IPAS Action Buttons */
        .ms5-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--rrps-grey-60, #444);
        }
        .ms5-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ms5-action-btn.primary {
            background: var(--rrps-accent, #0066CC);
            color: white;
        }
        .ms5-action-btn.primary:hover {
            background: var(--rrps-accent-light, #3399FF);
        }
        .ms5-action-btn.disabled {
            background: var(--rrps-grey-60, #444);
            color: var(--rrps-grey-40, #888);
            cursor: not-allowed;
            opacity: 0.6;
        }
        .ms5-action-btn.disabled:hover {
            background: var(--rrps-grey-60, #444);
        }

        /* Editable Payment Terms */
        .ms5-payment-terms-edit {
            width: 100%;
            min-height: 60px;
            padding: 8px 10px;
            background: var(--rrps-grey-80, #1a1a2e);
            color: var(--rrps-text, #E0E0E0);
            border: 1px solid var(--rrps-accent, #0066CC);
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            line-height: 1.4;
            resize: vertical;
        }
        .ms5-payment-terms-edit:focus {
            outline: none;
            border-color: var(--rrps-accent-light, #3399FF);
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.2);
        }
        .ms5-field-edit-hint {
            font-size: 10px;
            color: var(--rrps-grey-40, #888);
            margin-top: 4px;
        }

        /* MS5 Entry Form Styles - Inline Report Style */
        .ms5-report {
            background: var(--rrps-grey-80);
            border-radius: 12px;
            padding: 20px;
            margin: 12px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .ms5-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ms5-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--rrps-accent);
        }

        .ms5-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .ms5-summary-bar {
            background: var(--rrps-navy);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .ms5-summary-bar .summary-item {
            display: flex;
            flex-direction: column;
        }

        .ms5-summary-bar .summary-label {
            font-size: 10px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .ms5-summary-bar .summary-value {
            font-size: 14px;
            font-weight: 600;
        }

        .ms5-section {
            margin-bottom: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .ms5-section-header {
            background: rgba(255,255,255,0.08);
            padding: 10px 14px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ms5-section-header .section-number {
            background: var(--rrps-accent);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .ms5-section-body {
            padding: 14px;
        }

        .ms5-field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }

        .ms5-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .ms5-field label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
        }

        .ms5-field .value {
            font-size: 13px;
            color: var(--text-primary);
            padding: 6px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            min-height: 32px;
            display: flex;
            align-items: center;
        }

        .ms5-field .value.highlight {
            background: rgba(0, 122, 204, 0.15);
            border-color: var(--rrps-accent);
            color: var(--rrps-accent-light);
        }

        /* Engine Items Table */
        .ms5-engines-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .ms5-engines-table th {
            background: rgba(255,255,255,0.08);
            padding: 8px 10px;
            text-align: left;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ms5-engines-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .ms5-engines-table tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .ms5-engine-header {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            padding: 8px 10px;
            background: rgba(0, 122, 204, 0.1);
            border-radius: 4px;
            color: var(--rrps-accent-light);
        }

        .ms5-footer {
            margin-top: 16px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .ms5-footer .highlight-note {
            margin-top: 6px;
            font-size: 11px;
            color: var(--rrps-accent);
        }

        /* Messages Area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            animation: fadeIn 0.2s ease;
        }

        /* Allow inline reports (KYP, IPAS, MS5, FinOps) to use more width */
        .message:has(.kyp-report),
        .message:has(.ipas-report),
        .message:has(.ms5-report),
        .message:has(.finops-report) {
            max-width: 95%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.agent {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }

        .message-content {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.agent .message-content {
            background: var(--white);
            color: var(--rrps-dark);
            border-radius: 4px 12px 12px 12px;
        }

        /* Reports (KYP, IPAS, MS5, FinOps) get transparent message background */
        .message.agent .message-content:has(.kyp-report),
        .message.agent .message-content:has(.ipas-report),
        .message.agent .message-content:has(.ms5-report),
        .message.agent .message-content:has(.finops-report) {
            background: transparent;
            padding: 0;
        }

        .message.user .message-content {
            background: var(--rrps-accent);
            color: var(--white);
            border-radius: 12px 4px 12px 12px;
        }

        .message-meta {
            font-size: 11px;
            color: var(--rrps-silver);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message.user .message-meta {
            text-align: right;
        }

        .source-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .source-chip {
            background: var(--rrps-light);
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 11px;
            color: #64748B;
        }

        .message-content h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--rrps-navy);
            margin: 0 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--rrps-accent);
        }

        .message-content h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--rrps-navy);
            margin: 16px 0 8px 0;
        }

        .message-content h4 {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin: 12px 0 6px 0;
        }

        .message-content p {
            margin: 0 0 10px 0;
            line-height: 1.6;
        }

        .message-content ul,
        .message-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message-content ol {
            list-style-type: decimal;
        }

        .message-content li {
            margin-bottom: 8px;
            line-height: 1.6;
            text-align: left;
        }

        /* Ensure paragraphs following list items align with bullet text */
        .message-content li + p,
        .message-content li p {
            margin-left: 0;
        }

        .message-content strong {
            color: var(--rrps-navy);
            font-weight: 600;
        }

        .sources-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #E2E8F0;
        }

        .sources-label {
            font-size: 11px;
            font-weight: 600;
            color: #64748B;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .source-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .source-link {
            background: var(--rrps-light);
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            color: var(--rrps-accent);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .source-link:hover {
            background: var(--rrps-accent);
            color: var(--white);
            border-color: var(--rrps-accent);
        }

        /* Opportunity Report Cards */
        .opp-report {
            background: var(--rrps-grey-80, #1a1a2e);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--rrps-grey-60, #333);
        }
        .opp-report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--rrps-grey-60, #444);
        }
        .opp-report-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            color: var(--rrps-text, #E0E0E0);
        }
        .opp-summary-badges {
            display: flex;
            gap: 8px;
        }
        .opp-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .opp-badge.opp-won { background: #059669; color: white; }
        .opp-badge.opp-open { background: #2563eb; color: white; }
        .opp-badge.opp-lost { background: #dc2626; color: white; }
        .opp-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .opp-card {
            background: var(--rrps-grey-90, #0f0f1e);
            border: 1px solid var(--rrps-grey-60, #333);
            border-radius: 8px;
            padding: 14px 16px;
            transition: border-color 0.2s;
        }
        .opp-card:hover {
            border-color: var(--rrps-accent, #0066CC);
        }
        .opp-card.opp-won { border-left: 3px solid #059669; }
        .opp-card.opp-lost { border-left: 3px solid #dc2626; }
        .opp-card.opp-open { border-left: 3px solid #2563eb; }
        .opp-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .opp-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--rrps-accent, #0066CC);
        }
        .opp-status-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .opp-status-badge.opp-won { background: rgba(5,150,105,0.2); color: #34d399; }

        .order-field {

            align-items: center;

        /* Credit Report Card */
        .credit-report { background: var(--rrps-grey-80, #1a1a2e); border-radius: 12px; padding: 20px; border: 1px solid var(--rrps-grey-60, #333); }
        .credit-report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rrps-grey-60, #444); }
        .credit-report-title { font-size: 16px; font-weight: 700; color: var(--rrps-text, #E0E0E0); }
        .credit-status-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .credit-status-badge.approved { background: rgba(5,150,105,0.2); color: #34d399; }
        .credit-status-badge.blocked { background: rgba(220,38,38,0.2); color: #f87171; }
        .credit-hero { margin-bottom: 16px; }
        .credit-hero-name { font-size: 18px; font-weight: 700; color: var(--rrps-text, #E0E0E0); }
        .credit-hero-id { font-size: 12px; color: var(--rrps-grey-30, #999); margin-top: 2px; }
        .credit-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 16px; padding: 12px; background: var(--rrps-grey-90, #0f0f1e); border-radius: 8px; }
        .credit-field label { font-size: 11px; color: var(--rrps-grey-30, #888); text-transform: uppercase; letter-spacing: 0.5px; }
        .credit-field .value { font-size: 14px; font-weight: 600; color: var(--rrps-text, #E0E0E0); margin-top: 2px; }
        .credit-meter { height: 8px; background: var(--rrps-grey-70, #222); border-radius: 4px; overflow: hidden; margin-top: 12px; }
        .credit-meter-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .credit-meter-label { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--rrps-grey-30, #999); }

        /* Opportunity detail lines within numbered lists */
        .opp-detail {
            display: inline;
            font-size: 12px;
            color: var(--rrps-grey-20, #bbb);
            padding-left: 8px;
        }

        /* Numbered lists rendered as nested <ul>: ● level 1, ○ level 2 (browser defaults) */

        /* Inline source references (superscript) */
        .source-ref {
            font-size: 10px;
            vertical-align: super;
            line-height: 0;
            color: var(--rrps-accent);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            padding: 0 1px;
        }
        .source-ref:hover {
            text-decoration: underline;
            color: var(--rrps-primary);
        }

        /* Follow-up Suggestions */
        .follow-up-suggestions {
            margin: 16px 0;
            padding: 16px;
            background: rgba(0, 102, 179, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(0, 102, 179, 0.2);
        }

        .follow-up-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--rrps-accent);
            margin-bottom: 12px;
        }

        .follow-up-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .follow-up-btn {
            background: var(--white);
            border: 1px solid var(--rrps-accent);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--rrps-accent);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .follow-up-btn:hover {
            background: var(--rrps-accent);
            color: var(--white);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 16px;
            background: var(--white);
            border-radius: 4px 12px 12px 12px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--rrps-accent);
            border-radius: 50%;
            animation: bounce 0.6s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Streaming cursor — blinking bar at the end of streaming text */
        .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--rrps-accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: cursor-blink 0.7s steps(1) infinite;
        }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Streaming status pill shown during generation */
        .streaming-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            font-size: 11px;
            color: var(--rrps-accent);
            background: rgba(0, 40, 85, 0.06);
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .streaming-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--rrps-accent);
            animation: pulse-dot 1.2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 16px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: var(--rrps-navy);
            padding: 8px;
            border-radius: 12px;
        }

        .input-field {
            flex: 1;
            background: var(--white);
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
        }

        .input-field:focus {
            box-shadow: 0 0 0 2px var(--rrps-accent);
        }

        .send-btn {
            background: var(--rrps-accent);
            border: none;
            border-radius: 8px;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .send-btn:hover {
            background: #0052A3;
        }

        .send-btn:disabled {
            background: var(--rrps-silver);
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--white);
        }

        /* Responsive */
        /* Tablet breakpoint */
        @media (max-width: 1024px) {
            .quick-actions {
                flex-wrap: wrap;
                gap: 6px;
            }

            .quick-btn {
                flex: 0 1 auto;
            }

            .message {
                max-width: 92%;
            }

            /* FinOps report cards: stack on tablet */
            .finops-summary-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 10px 16px;
            }

            .title {
                font-size: 14px;
            }

            .chat-container {
                padding: 0 8px;
            }

            .quick-actions {
                padding: 12px 0;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .quick-btn {
                padding: 6px 10px;
                font-size: 12px;
                white-space: nowrap;
            }

            .message {
                max-width: 95%;
            }

            .message-content {
                padding: 10px 12px;
                font-size: 13px;
            }

            /* FinOps cards: single column on mobile */
            .finops-summary-grid {
                grid-template-columns: 1fr !important;
            }

            /* Tables: horizontal scroll on mobile */
            .finops-table-wrap,
            .kyp-table-wrap {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                min-width: 500px;
            }

            /* Input area compact on mobile */
            .input-container {
                padding: 8px 12px;
            }

            .message-input {
                font-size: 14px;
            }
        }

        /* Small phone */
        @media (max-width: 480px) {
            .header {
                padding: 8px 12px;
            }

            .title {
                font-size: 13px;
            }

            .quick-btn {
                font-size: 11px;
                padding: 5px 8px;
            }

            .message-content {
                font-size: 12px;
                padding: 8px 10px;
            }

            .follow-up-btn {
                font-size: 12px;
                padding: 6px 10px;
            }

        /* Scrollbar */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {

        }

        /* Customer Selection Modal */
        /* Risk badge classes used by validation results */
        .risk-low { background: #10B98120; color: #10B981; }

        .kyp-report {

        /* High contrast status badges - solid backgrounds for readability */

        .kyp-section {

        .kyp-section.status-warning { border-left-color: #d97706; background: rgba(217, 119, 6, 0.1); }

        .kyp-section-header {

        /* Legacy aliases */
        .kyp-section-status.passed { background: #059669; color: #fff; }
        .kyp-section-status.warning { background: #d97706; color: #fff; }
        .kyp-section-status.failed { background: #dc2626; color: #fff; }

        .kyp-fields {
            display: grid;
            gap: 10px;

        .kyp-field {

            justify-content: space-between;

            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;

            word-break: break-word;

            border-top: 1px solid rgba(255,255,255,0.1);

        .kyp-subsection-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);

            letter-spacing: 0.5px;

            color: var(--text-muted);

            display: flex;
            flex-direction: column;

            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .kyp-assessment-row:last-child {
            border-bottom: none;
        }

        .kyp-assessment-category {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .kyp-assessment-status {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kyp-assessment-notes {
            color: var(--text-primary);
            overflow-wrap: break-word;
            word-break: break-word;
            min-width: 0;
        }

        /* Recommendation - Prominent */
        .kyp-recommendation {
            background: linear-gradient(135deg, rgba(0,102,204,0.15) 0%, rgba(16,16,122,0.2) 100%);
            border-radius: 10px;
            padding: 18px;
            margin-top: 16px;
            border: 1px solid rgba(0,102,204,0.3);
        }

        .kyp-recommendation-decision {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kyp-recommendation-decision.proceed { color: var(--success); }
        .kyp-recommendation-decision.conditional { color: var(--warning); }
        .kyp-recommendation-decision.blocked { color: var(--error); }
        .kyp-recommendation-decision.pending { color: var(--info); }

        .kyp-recommendation-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Issues and Conditions */
        .kyp-issues, .kyp-conditions {
            margin-top: 14px;
        }

        .kyp-issues-title, .kyp-conditions-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kyp-issues ul, .kyp-conditions ul {
            margin: 0;
            padding-left: 20px;
        }

        .kyp-issues li, .kyp-conditions li {
            font-size: 13px;
            color: var(--text-primary);
            margin: 6px 0;
            line-height: 1.5;
        }

        /* Executive Summary Mode */
        .kyp-executive-summary {
            background: var(--rrps-grey-80);
            border-radius: 12px;
            padding: 20px;
            margin: 12px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .kyp-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .kyp-summary-entity {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .kyp-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }

        .kyp-summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            font-size: 13px;
        }

        .kyp-summary-category {
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kyp-summary-status {
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .kyp-summary-status.passed { background: var(--success); color: var(--white); }
        .kyp-summary-status.warning { background: var(--warning); color: var(--white); }
        .kyp-summary-status.failed { background: var(--error); color: var(--white); }
        .kyp-summary-status.not-checked { background: var(--rrps-silver); color: var(--white); }

        .kyp-summary-recommendation {
            margin-top: 16px;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0,102,204,0.1) 0%, rgba(16,16,122,0.15) 100%);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .kyp-summary-rec-text {
            color: var(--text-primary);
            font-size: 14px;
        }

        .kyp-summary-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .kyp-action-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .kyp-action-btn.primary {
            background: var(--rrps-accent);
            color: var(--white);
        }

        .kyp-action-btn.primary:hover {
            background: var(--rrps-accent-light);
        }

        .kyp-action-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .kyp-action-btn.secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        /* =================================================================
           Finance Ops Dashboard Styles - Billing & Collections
           ================================================================= */
        .finops-report {
            background: var(--rrps-grey-80);
            border-radius: 12px;
            padding: 20px;
            margin: 12px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .finops-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .finops-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .finops-title-icon {
            font-size: 24px;
        }

        .finops-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .finops-summary-badge {
            display: flex;
            gap: 12px;
        }

        .finops-metric {
            text-align: center;
            padding: 10px 16px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            min-width: 90px;
        }

        .finops-metric-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .finops-metric-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .finops-metric.overdue .finops-metric-value {
            color: var(--error);
        }

        .finops-metric.pending .finops-metric-value {
            color: var(--warning);
        }

        /* Overdue subset indicator (shows overdue count within total) */
        .finops-metric-overdue-subset {
            font-size: 11px;
            color: var(--error);
            margin-top: 6px;
            padding: 3px 8px;
            background: rgba(220, 38, 38, 0.15);
            border-radius: 4px;
            font-weight: 500;
        }

        .finops-metric-overdue-subset .overdue-indicator {
            color: var(--error);
        }

        /* Aging Buckets - Color-coded bar chart */
        .finops-aging {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
        }

        .finops-aging-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .finops-aging-buckets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .finops-bucket {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .finops-bucket::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        /* Aging bucket colors - 4 buckets: Current (green), 0-30 (amber), 30-45 (orange), 45+ (red) */
        .finops-bucket.current { background: rgba(5, 150, 105, 0.15); }
        .finops-bucket.current::before { background: var(--success); }  /* Green */

        .finops-bucket.days-0-30 { background: rgba(217, 119, 6, 0.15); }
        .finops-bucket.days-0-30::before { background: var(--warning); }  /* Amber */

        .finops-bucket.days-30-45 { background: rgba(234, 88, 12, 0.15); }
        .finops-bucket.days-30-45::before { background: #ea580c; }  /* Orange */

        .finops-bucket.days-45-plus { background: rgba(220, 38, 38, 0.15); }
        .finops-bucket.days-45-plus::before { background: var(--error); }  /* Red */

        .finops-bucket-count {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .finops-bucket-amount {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .finops-bucket-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 6px;
        }

        /* Group toggle buttons */
        .finops-toggle-btn {
            padding: 5px 12px;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.3px;
            transition: all 0.15s;
        }
        .finops-toggle-btn.active {
            background: rgba(255,255,255,0.12);
            color: var(--text-primary);
            font-weight: 600;
        }
        .finops-toggle-btn:hover:not(.active) {
            background: rgba(255,255,255,0.06);
        }
        .finops-expand-all-btn {
            padding: 5px 12px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.3px;
            transition: all 0.15s;
        }
        .finops-expand-all-btn:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
        }

        /* Billing/Collections Items List */
        .finops-items {
            margin-top: 16px;
        }

        .finops-items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .finops-items-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .finops-timeline-group {
            margin-bottom: 12px;
        }

        .finops-timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .finops-timeline-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .finops-items-count {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 4px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }

        .finops-item {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-left: 4px solid var(--rrps-accent);
            transition: all 0.2s ease;
        }

        .finops-item:hover {
            background: rgba(255,255,255,0.09);
        }

        .finops-item:last-child {
            margin-bottom: 0;
        }

        /* Item status colors */
        .finops-item.status-current { border-left-color: var(--success); }
        .finops-item.status-pending { border-left-color: var(--info); }
        .finops-item.status-warning { border-left-color: var(--warning); }
        .finops-item.status-overdue { border-left-color: var(--error); }

        .finops-item-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .finops-item-main {
            flex: 1;
        }

        .finops-item-customer {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .finops-item-doc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .finops-order-link {
            color: var(--rrps-accent);
            text-decoration: none;
            font-weight: 600;
        }
        .finops-order-link:hover {
            text-decoration: underline;
        }

        .finops-item-right {
            text-align: right;
            flex-shrink: 0;
        }

        .finops-item-amount {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .finops-item-due-inline {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 2px;
        }

        .finops-item-status {
            display: inline-block;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 2px;
            text-align: right;
        }

        .finops-item-status.current { background: rgba(5,150,105,0.2); color: #34d399; }
        .finops-item-status.pending { background: rgba(37,99,235,0.2); color: #60a5fa; }
        .finops-item-status.warning { background: rgba(217,119,6,0.2); color: #fbbf24; }
        .finops-item-status.overdue { background: rgba(220,38,38,0.2); color: #f87171; }

        .finops-show-toggle {
            background: none;
            border: none;
            color: var(--rrps-accent);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 0 4px 16px;
        }
        .finops-show-toggle:hover {
            text-decoration: underline;
        }

        .finops-item-details {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 12px;
        }

        .finops-item-detail {
            color: var(--text-secondary);
        }

        .finops-item-detail span {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Days overdue indicator */
        .finops-days-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            margin-top: 6px;
        }

        .finops-days-indicator.current { color: var(--success); }
        .finops-days-indicator.pending { color: var(--info); }
        .finops-days-indicator.warning { color: var(--warning); }
        .finops-days-indicator.overdue { color: var(--error); }

        .finops-days-bar {
            width: 60px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .finops-days-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .finops-days-fill.current { background: var(--success); }
        .finops-days-fill.pending { background: var(--info); }
        .finops-days-fill.warning { background: var(--warning); }
        .finops-days-fill.overdue { background: var(--error); }

        /* Payment Terms Section */
        .finops-payment-terms {
            background: rgba(0, 102, 204, 0.1);
            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
            border: 1px solid rgba(0, 102, 204, 0.2);
        }

        .finops-terms-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .finops-terms-milestones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .finops-milestone {
            padding: 8px 12px;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
            font-size: 12px;
        }

        .finops-milestone-pct {
            font-weight: 700;
            color: var(--rrps-accent);
        }

        .finops-milestone-trigger {
            color: var(--text-secondary);
            margin-left: 4px;
        }

        /* Summary Footer */
        .finops-summary-footer {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .finops-total {
            font-size: 14px;
            color: var(--text-secondary);
            margin-left: auto;
            text-align: right;
        }

        .finops-total-amount {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-left: 8px;
            font-variant-numeric: tabular-nums;
        }

        .finops-actions {
            display: flex;
            gap: 10px;
        }

        .finops-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .finops-btn.primary {
            background: var(--rrps-accent);
            color: var(--white);
        }

        .finops-btn.primary:hover {
            filter: brightness(1.1);
        }

        .finops-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .finops-source {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
            text-align: right;
        }

        /* =================================================================
           Entity Selection Cards - For Customer Confirmation (like KYP)
           ================================================================= */
        .entity-selection {
            background: var(--rrps-grey-80);
            border-radius: 12px;
            padding: 20px;
            margin: 12px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .entity-selection-header {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .entity-selection-header .icon {
            font-size: 20px;
        }

        .entity-selection-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .entity-candidates {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .entity-candidate {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .entity-candidate:hover {
            background: rgba(0, 102, 204, 0.15);
            border-color: var(--rrps-accent);
        }

        .entity-candidate.selected {
            background: rgba(0, 102, 204, 0.2);
            border-color: var(--rrps-accent);
        }

        .entity-candidate-info {
            flex: 1;
        }

        .entity-candidate-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .entity-candidate-details {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .entity-candidate-detail {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .entity-candidate-confidence {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .entity-confidence-score {
            font-size: 16px;
            font-weight: 700;
        }

        .entity-confidence-score.high { color: #10B981; }
        .entity-confidence-score.medium { color: #F59E0B; }
        .entity-confidence-score.low { color: #EF4444; }

        .entity-confidence-label {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .entity-confidence-label.high { background: rgba(16, 185, 129, 0.2); color: #10B981; }
        .entity-confidence-label.medium { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        .entity-confidence-label.low { background: rgba(239, 68, 68, 0.2); color: #EF4444; }

        .entity-select-btn {
            background: var(--rrps-accent);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-left: 12px;
            transition: all 0.2s;
        }

        .entity-select-btn:hover {
            filter: brightness(1.15);
        }

        .entity-no-match {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

    </style>
</head>

                    Industry News

    <script>
        const API_BASE = window.location.origin;
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Session management for multi-turn conversations
        let sessionId = localStorage.getItem('chatSessionId');
        if (!sessionId) {
            sessionId = crypto.randomUUID();
            localStorage.setItem('chatSessionId', sessionId);
        }

        // Fetch app version from health endpoint
        fetch(`${API_BASE}/health`)
            .then(r => r.json())
            .then(data => {
                if (data.version) {
                    document.getElementById('appVersion').textContent = `v${data.version}`;
                }
            })
            .catch(() => {});

        // Delegated click handler for IPAS order cards (injected via innerHTML)
        messagesContainer.addEventListener('click', (e) => {
            const orderCard = e.target.closest('[data-order-index]');
            if (orderCard && window._ipasOrders) {
                const order = window._ipasOrders[parseInt(orderCard.dataset.orderIndex)];
                if (order) showMS5EntryFormInline(order.order_id);
            }
            // Entity selection delegation
            const entityEl = e.target.closest('[data-entity-index]');
            if (entityEl) {
                e.stopPropagation();
                selectEntity(parseInt(entityEl.dataset.entityIndex));
            }
        });

        // Quick action buttons — event delegation on container
        document.getElementById('quickActions').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (btn && !btn.disabled) quickAction(btn.dataset.action);

        // Current user role (set by loadUserProfile)
        let currentUserRole = 'sales_ops';

        // Role-based configuration
        const roleConfig = {
            sales_ops: {

                welcome: 'Welcome to RRPS Sales Ops Agent. I can help you with industry insights for Marine, Offshore Oil & Gas, and Marine Transportation sectors. I also provide competitor intelligence and customer due diligence. How can I assist you today?',
                placeholder: 'Ask about customers, competitors, or industry trends...',
                buttons: [
                    {
                        id: 'industry',
                        label: 'Industry News',
                        icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2m-4-3H9M7 16h6M7 12h10"/></svg>',
                        action: 'industry'
                    },
                    {
                        id: 'competitor',
                        label: 'Competitor Updates',
                        icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
                        action: 'competitor'
                    },
                    {
                        id: 'validate',
                        label: 'Validate Customer',
                        icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                        action: 'validate'
                    },
                    {
                        id: 'neworders',
                        label: 'New Orders',
                        icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>',
                        action: 'neworders',
                        showCount: true,
                        countKey: 'ipas_pending_count',
                        badgeClass: 'neworders'
                    }
                ],
                quickActions: {
                    industry: "What's the latest in Marine and Offshore?",
                    competitor: "Any recent updates on Caterpillar, Cummins, and MAN?",
                    validate: "Run KYP on ",
                    neworders: "__IPAS_ORDERS__"
                }
            },
            financeops: {
                title: 'Finance Ops Agent',
                welcome: 'Welcome to RRPS Finance Ops Agent. I can help you with billing status, payment terms, collections tracking, and accounts receivable insights. How can I assist you today?',
                placeholder: 'Ask about billing, collections, or payment status...',
                buttons: [
                    {
                        id: 'billing',
                        label: 'To Bill',
                        icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>',
                        action: 'billing',
                        showCount: true,
                        countKey: 'billing_count'
                    },
                    {
                        id: 'collections',
                        label: 'To Collect',
                        icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
                        action: 'collections',
                        showCount: false,
                        countKey: 'collections_count',
                        badgeClass: 'collections',
                        disabled: true,
                        tooltip: 'Coming soon — pending AR open items iFlow'
                    }
                ],
                quickActions: {
                    billing: "Show billing items pending — DPs and invoices to create.",
                    collections: "Show pending collections — billed items awaiting payment."
                }
            }
        };

        // Badge counts for financeops (updated via API)
        let finopsBadgeCounts = {
            billing_count: 0,
            collections_count: 0,
            overdue_count: 0
        };

        // Badge counts for IPAS orders (updated via API)
        let ipasBadgeCounts = {
            ipas_pending_count: 0
        };

        // Cached IPAS orders for modal display
        let cachedIPASOrders = [];

        // Apply role-based UI
        function applyRoleUI(role) {
            const config = roleConfig[role] || roleConfig.sales_ops;
            currentUserRole = role;

            // Update page title
            document.title = `${config.title} | RRPS`;

            // Update header title
            const titleEl = document.getElementById('agentTitle');
            if (titleEl) titleEl.textContent = config.title;

            // Update welcome message
            const welcomeEl = document.getElementById('welcomeContent');
            if (welcomeEl) welcomeEl.textContent = config.welcome;

            // Update input placeholder
            const inputEl = document.getElementById('messageInput');
            if (inputEl) inputEl.placeholder = config.placeholder;

            // Update quick action buttons
            renderQuickActionButtons(config.buttons);

            // Fetch badge counts based on role
            if (role === 'financeops') {
                fetchFinopsBadgeCounts();
            } else if (role === 'sales_ops') {
                fetchIPASBadgeCounts();
            }
        }

        // Render quick action buttons based on role
        function renderQuickActionButtons(buttons) {
            const container = document.getElementById('quickActions');
            if (!container) return;

            container.innerHTML = buttons.map(btn => {
                let badgeHtml = '';
                if (btn.showCount) {
                    // Check both finops and IPAS badge counts
                    const count = finopsBadgeCounts[btn.countKey] || ipasBadgeCounts[btn.countKey] || 0;
                    const badgeClass = btn.badgeClass ? ` ${btn.badgeClass}` : '';
                    badgeHtml = `<span class="badge${badgeClass}" id="badge-${btn.id}">${count}</span>`;
                }
                const disabledClass = btn.disabled ? ' disabled' : '';
                const disabledAttr = btn.disabled ? ' disabled' : '';
                const titleAttr = btn.tooltip ? ` title="${btn.tooltip}"` : '';
                return `
                    <button class="quick-btn${disabledClass}" data-action="${btn.action}"${disabledAttr}${titleAttr}>
                        ${btn.icon}
                        ${btn.label}${badgeHtml}
                    </button>
                `;
            }).join('');
        }

        // Fetch badge counts for financeops dashboard
        async function fetchFinopsBadgeCounts() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/finops/summary`, {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    finopsBadgeCounts = {
                        billing_count: data.billing_count || 0,
                        collections_count: data.collections_count || 0,
                        overdue_count: data.overdue_count || 0
                    };
                    // Update badge displays
                    updateBadgeDisplay('billing', finopsBadgeCounts.billing_count, false);
                    updateBadgeDisplay('collections', finopsBadgeCounts.collections_count, false);
                } else if (handleAuthError(response)) {
                    return;
                } else if (response.status === 403) {
                    // Permission denied - user doesn't have financeops role
                    console.warn('FinOps access denied - insufficient permissions');
                    updateBadgeDisplay('billing', '—', false);
                    updateBadgeDisplay('collections', '—', false);
                    // Set permission-specific tooltips
                    const billingBadge = document.getElementById('badge-billing');
                    const collectionsBadge = document.getElementById('badge-collections');
                    if (billingBadge) billingBadge.title = 'Requires Finance Ops role';
                    if (collectionsBadge) collectionsBadge.title = 'Requires Finance Ops role';
                } else {
                    // API error - show error state
                    console.error('FinOps API error:', response.status);
                    updateBadgeDisplay('billing', '?', true);
                    updateBadgeDisplay('collections', '?', true);
                }
            } catch (error) {
                console.error('Failed to fetch finops badge counts:', error);
                // Network error - show error state on badges
                updateBadgeDisplay('billing', '!', true);
                updateBadgeDisplay('collections', '!', true);
            }
        }

        // Fetch badge counts for IPAS pending orders
        async function fetchIPASBadgeCounts() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/ipas/summary`, {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    ipasBadgeCounts = {
                        ipas_pending_count: data.pending_count || 0
                    };
                    // Update badge display
                    updateBadgeDisplay('neworders', ipasBadgeCounts.ipas_pending_count, false);
                } else if (handleAuthError(response)) {
                    return;
                } else {
                    console.error('IPAS API error:', response.status);
                    updateBadgeDisplay('neworders', '?', true);
                }
            } catch (error) {
                console.error('Failed to fetch IPAS badge counts:', error);
                updateBadgeDisplay('neworders', '!', true);
            }
        }

        // Update badge display
        function updateBadgeDisplay(buttonId, count, isError = false) {
            const badge = document.getElementById(`badge-${buttonId}`);
            if (badge) {
                badge.textContent = count;
                // Clear existing state classes
                badge.classList.remove('overdue', 'error');

                if (isError) {
                    badge.classList.add('error');
                    badge.title = 'Failed to load - click to retry';
                } else {
                    badge.title = '';
                    // Add overdue class if needed
                    if (buttonId === 'collections' && finopsBadgeCounts.overdue_count > 0) {
                        badge.classList.add('overdue');
                    }
                }
            }
        }

        // Quick action handler (role-aware)
        function quickAction(type) {
            const config = roleConfig[currentUserRole] || roleConfig.sales_ops;
            const action = config.quickActions[type];

            // Special handling for IPAS orders - use chat flow like KYP
            if (type === 'neworders') {
                // Trigger IPAS display through the chat message flow
                messageInput.value = '';
                addMessage('Show me new IPAS orders', true);
                showTyping();

                // Fetch IPAS orders and display using same pattern as KYP
                fetchAndDisplayIPASOrders();
                return;
            }

            if (action) {
                // Actions that need user input (end with space): fill + focus
                // Actions that are complete prompts: send immediately
                if (action.endsWith(' ')) {
                    messageInput.value = action;
                    messageInput.focus();
                    messageInput.setSelectionRange(action.length, action.length);
                } else {
                    messageInput.value = action;
                    sendMessage();
                }
            }
        }

        // ===================================================================
        // IPAS Orders - Inline Chat Display (same pattern as KYP)
        // ===================================================================

        async function fetchAndDisplayIPASOrders() {
            // This follows the exact same pattern as KYP report display
            try {
                const response = await fetch(`${API_BASE}/api/v1/ipas/orders`, {
                    credentials: 'include'
                });
                if (handleAuthError(response)) return;
                const data = await response.json();
                cachedIPASOrders = data.orders || [];
                hideTyping();

                // Use same addValidationMessage as KYP reports
                const htmlContent = formatIPASOrdersReport(cachedIPASOrders);
                addValidationMessage(htmlContent);

            } catch (error) {
                console.error('Failed to load IPAS orders:', error);
                hideTyping();
                addMessage('Failed to load IPAS orders. Please try again.', false);
            }
        }

        // Legacy alias
        async function showIPASOrdersInline() { await fetchAndDisplayIPASOrders(); }

        function formatIPASOrdersReport(orders) {

                return `

        async function showMS5EntryFormInline(orderId) {
            // Add user message first (like KYP flow)
            addMessage(`Show MS5 entry data for Order #${orderId}`, true);
            showTyping();

            try {
                const response = await fetch(`${API_BASE}/api/v1/ipas/orders/${orderId}`, {
                    credentials: 'include'
                });
                if (handleAuthError(response)) return;
                const order = await response.json();
                hideTyping();

                // Use same addValidationMessage as KYP reports
                const htmlContent = formatMS5EntryReport(order);
                addValidationMessage(htmlContent);

            } catch (error) {
                console.error('Failed to load order details:', error);
                hideTyping();
                addMessage('Failed to load order details. Please try again.', false);
            }
        }

        function formatIPASDate(dateStr) {
            if (!dateStr || dateStr.length !== 8) return dateStr || '-';
            // Format YYYYMMDD to YYYY-MM-DD
            return `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
        }

        async function exportIPASToExcel(orderId) {
            // Get any edited payment terms from the textarea
            const ptTextarea = document.querySelector(`.ms5-payment-terms-edit[data-order-id="${orderId}"]`);
            const editedPaymentTerms = ptTextarea ? ptTextarea.value : '';

            try {
                const response = await fetch(`${API_BASE}/api/v1/ipas/orders/${orderId}/export`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ payment_terms: editedPaymentTerms })
                });
                if (handleAuthError(response)) return;
                if (!response.ok) {
                    addMessage('Failed to generate Excel export. Please try again.', false);
                    return;
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `SAP_Order_${orderId}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                console.error('Export failed:', error);
                addMessage('Export failed. Please try again.', false);
            }
        }
