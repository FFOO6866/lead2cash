            }
        }

        function formatContent(content, sources) {
            // Step 1: Strip [N] citations before escaping — we'll re-inject after
            // Replace [N] with unique placeholders that survive escapeHtml
            let citationMap = {};
            let formatted = content;
            if (sources && sources.length > 0) {
                formatted = formatted.replace(/\[(\d+)\]/g, (match, num) => {
                    const idx = parseInt(num) - 1;
                    if (idx >= 0 && idx < sources.length) {
                        const placeholder = `CITEREF${num}ENDCITE`;
                        const src = sources[idx];
                        if (src.startsWith('http://') || src.startsWith('https://')) {
                            try {
                                const domain = new URL(src).hostname.replace('www.', '');
                                citationMap[placeholder] = `<a href="${encodeURI(src)}" target="_blank" rel="noopener noreferrer" class="source-ref" title="${domain}">[${num}]</a>`;
                            } catch(e) { citationMap[placeholder] = ''; }
                        } else {
                            citationMap[placeholder] = `<span class="source-ref" title="${src}">[${num}]</span>`;
                        }
                        return placeholder;
                    }
                    return '';
                });
            } else {
                formatted = formatted.replace(/\[\d+\]/g, '');
            }

            // Step 2: Process line by line — escape text before inserting into HTML
            const lines = formatted.split('\n');
            let result = [];
            let inList = false;
            let listType = null;       // 'ul' for bullets, 'nl' for numbered (rendered as nested <ul>)
            let inSubList = false;     // nested <ul> open inside a numbered-list <li>
            let nlItemOpen = false;    // numbered-list <li> left unclosed for sub-items
            let nlPendingClose = false;// defer closing numbered list across LLM blank lines

            // Close numbered-list nesting state (sub-list + parent li)
            function closeNlItem() {
                if (inSubList) { result.push('</ul>'); inSubList = false; }
                if (nlItemOpen) { result.push('</li>'); nlItemOpen = false; }
            }
            // Close any open list entirely
            function closeList() {
                closeNlItem();
                if (inList) { result.push('</ul>'); inList = false; listType = null; }
                nlPendingClose = false;
            }

            for (let line of lines) {
                let trimmed = line.trim();
                if (!trimmed) {
                    // Numbered lists: defer close — LLM puts blank lines between items
                    if (inList && listType === 'nl') { nlPendingClose = true; continue; }
                    if (inList) { result.push('</ul>'); inList = false; listType = null; }
                    continue;
                }

                // Resolve pending numbered-list close
                if (nlPendingClose) {
                    nlPendingClose = false;
                    if (!/^\d+\.\s/.test(trimmed) && !trimmed.startsWith('- ') && !trimmed.startsWith('* ')) {
                        closeList();
                    }
                }

                if (trimmed.startsWith('#### ')) {
                    closeList();
                    result.push(`<h4>${escapeHtml(trimmed.slice(5))}</h4>`);
                } else if (trimmed.startsWith('### ')) {
                    closeList();
                    result.push(`<h4>${escapeHtml(trimmed.slice(4))}</h4>`);
                } else if (trimmed.startsWith('## ')) {
                    closeList();
                    result.push(`<h3>${escapeHtml(trimmed.slice(3))}</h3>`);
                } else if (trimmed.startsWith('# ')) {
                    closeList();
                    result.push(`<h2>${escapeHtml(trimmed.slice(2))}</h2>`);
                }
                else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    // Inside a numbered list → nested sub-item (○ circle bullet)
                    if (inList && listType === 'nl') {
                        if (!inSubList) { result.push('<ul>'); inSubList = true; }
                        result.push(`<li>${escapeHtml(trimmed.slice(2))}</li>`);
                        continue;
                    }
                    if (inList && listType !== 'ul') { closeList(); }
                    if (!inList) { result.push('<ul>'); inList = true; listType = 'ul'; }
                    result.push(`<li>${escapeHtml(trimmed.slice(2))}</li>`);
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    // New numbered item — close previous item's sub-list first
                    closeNlItem();
                    if (inList && listType !== 'nl') { result.push('</ul>'); inList = false; listType = null; }
                    if (!inList) { result.push('<ul>'); inList = true; listType = 'nl'; }
                    // Leave <li> unclosed so sub-items can nest inside
                    result.push(`<li>${escapeHtml(trimmed.replace(/^\d+\.\s/, ''))}`);
                    nlItemOpen = true;
                }
                else {
                    // Inside a numbered list → nested sub-item
                    if (inList && listType === 'nl') {
                        if (!inSubList) { result.push('<ul>'); inSubList = true; }
                        result.push(`<li>${escapeHtml(trimmed)}</li>`);
                        continue;
                    }
                    // Inside a bullet list with indented continuation
                    if (inList && line !== trimmed && result.length > 0) {
                        const lastItem = result[result.length - 1];
                        if (lastItem && lastItem.endsWith('</li>')) {
                            result[result.length - 1] = lastItem.slice(0, -5) + `<br><span class="opp-detail">${escapeHtml(trimmed)}</span></li>`;
                            continue;
                        }
                    }
                    if (inList) { closeList(); }
                    result.push(`<p>${escapeHtml(trimmed)}</p>`);
                }
            }
            closeList();

            formatted = result.join('');
            // Convert **bold** to <strong>
            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // Step 3: Re-inject citation HTML (after escaping is done, so tags render correctly)
            for (const [placeholder, html] of Object.entries(citationMap)) {
                formatted = formatted.replace(new RegExp(placeholder, 'g'), html);
            }

            return formatted;
        }

        function addMessage(content, isUser = false, sources = [], isHtml = false) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'agent'}`;

            let sourcesHtml = '';
            if (sources.length > 0) {
                // Numbered reference list with subscript-style links
                const sourceItems = sources.map((s, i) => {
                    try {
                        if (s.startsWith('http://') || s.startsWith('https://')) {
                            const domain = new URL(s).hostname.replace('www.', '');
                            return `<a href="${encodeURI(s)}" target="_blank" rel="noopener noreferrer" class="source-link">[${i+1}] ${escapeHtml(domain)}</a>`;
                        } else {
                            return `<span class="source-link source-internal">[${i+1}] ${escapeHtml(s)}</span>`;
                        }
                    } catch (e) {
                        return `<span class="source-link source-internal">[${i+1}] ${escapeHtml(s)}</span>`;
                    }
                }).join('');
                sourcesHtml = `<div class="sources-section">
                    <div class="sources-label">Sources:</div>
                    <div class="source-links">${sourceItems}</div>
                </div>`;
            }

            // If content is already HTML (e.g., entity selection cards), use directly
            // Pass sources to formatContent so [1], [2] references become clickable superscripts
            const formattedContent = isHtml ? content : (isUser ? content : formatContent(content, sources));

            msg.innerHTML = `
                <div class="message-content">
                    ${formattedContent}
                    ${sourcesHtml}
                </div>
                <div class="message-meta">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
            `;
            messagesContainer.appendChild(msg);

            // For user messages: scroll to bottom (keeps input visible)
            // For agent messages: scroll so the TOP of the response is visible
            if (isUser) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } else {
                scrollToTopOfElement(msg);
            }
        }

        function showFollowUpSuggestions(suggestions) {
            // Remove any existing follow-up suggestions
            const existing = document.querySelector('.follow-up-suggestions');
            if (existing) existing.remove();

            const container = document.createElement('div');
            container.className = 'follow-up-suggestions';
            container.innerHTML = `
                <div class="follow-up-label">Suggested follow-ups:</div>
                <div class="follow-up-buttons">
                    ${suggestions.map((s, i) => `<button class="follow-up-btn" data-follow-up-index="${i}">${escapeHtml(s)}</button>`).join('')}
                </div>
            `;
            // Use event delegation instead of inline onclick to prevent XSS
            container.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-follow-up-index]');
                if (btn) {
                    const idx = parseInt(btn.dataset.followUpIndex);
                    if (suggestions[idx]) askFollowUp(suggestions[idx]);
                }
            });
            messagesContainer.appendChild(container);
            // Don't scroll here — the agent response already scrolled to its start.
            // Follow-up buttons appear below the viewport; user scrolls down naturally.
        }

        function askFollowUp(question) {
            // Remove follow-up suggestions
            const existing = document.querySelector('.follow-up-suggestions');
            if (existing) existing.remove();

            // Set the question and send
            messageInput.value = question;
            sendMessage();
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'message agent';
            typing.id = 'typingIndicator';
            typing.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            messagesContainer.appendChild(typing);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            statusDot.className = 'status-dot typing';
            statusText.textContent = 'Typing...';
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
            statusDot.className = 'status-dot';
            statusText.textContent = 'Connected';
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            messageInput.value = '';
            sendBtn.disabled = true;

            // Timeout configuration: 2.5 minutes for LLM requests
            const REQUEST_TIMEOUT_MS = 150000;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

            // ── Streaming state ──
            let streamingMsgEl = null;   // The message bubble we append tokens to
            let contentEl = null;        // Inner content div
            let cursorEl = null;         // Blinking cursor element
            let rawText = '';            // Accumulated raw text
            let collectedSources = [];   // Sources from tools_complete event
            let isStructuredResponse = false; // KYP/FinOps — don't stream, wait for full data
            let fullResponseData = null; // For structured responses

            // Create the streaming message bubble immediately
            function createStreamingBubble() {
                hideTyping();
                streamingMsgEl = document.createElement('div');
                streamingMsgEl.className = 'message agent';
                streamingMsgEl.id = 'streamingMessage';
                streamingMsgEl.innerHTML = `
                    <div class="message-content">
                        <div class="streaming-content"></div>
                    </div>
                    <div class="message-meta">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                `;
                messagesContainer.appendChild(streamingMsgEl);
                contentEl = streamingMsgEl.querySelector('.streaming-content');
                // Add blinking cursor
                cursorEl = document.createElement('span');
                cursorEl.className = 'streaming-cursor';
                contentEl.appendChild(cursorEl);
                // Scroll to top of new message
                scrollToTopOfElement(streamingMsgEl);
            }

            // Append a chunk of text to the streaming bubble
            function appendToken(token) {
                if (!streamingMsgEl) createStreamingBubble();
                // Remove status pill once content starts flowing
                const pill = streamingMsgEl.querySelector('.streaming-status');
                if (pill) pill.remove();
                rawText += token;
                // Re-render formatted content + cursor
                const formatted = formatContent(rawText, collectedSources);
                contentEl.innerHTML = formatted;
                // Re-add cursor
                cursorEl = document.createElement('span');
                cursorEl.className = 'streaming-cursor';
                contentEl.appendChild(cursorEl);
                // Auto-scroll: keep bottom visible if user hasn't scrolled up
                const el = messagesContainer;
                const isNearBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 150;
                if (isNearBottom) {
                    el.scrollTop = el.scrollHeight;
                }
            }

            // Finalize the streaming message
            function finalizeStream() {
                if (cursorEl) cursorEl.remove();
                if (streamingMsgEl && rawText) {
                    // Final re-render with sources
                    const formatted = formatContent(rawText, collectedSources);
                    let sourcesHtml = '';
                    if (collectedSources.length > 0) {
                        const sourceItems = collectedSources.map((s, i) => {
                            try {
                                if (s.startsWith('http://') || s.startsWith('https://')) {
                                    const domain = new URL(s).hostname.replace('www.', '');
                                    return `<a href="${encodeURI(s)}" target="_blank" rel="noopener noreferrer" class="source-link">[${i+1}] ${escapeHtml(domain)}</a>`;
                                } else {
                                    return `<span class="source-link source-internal">[${i+1}] ${escapeHtml(s)}</span>`;
                                }
                            } catch (e) {
                                return `<span class="source-link source-internal">[${i+1}] ${escapeHtml(s)}</span>`;
                            }
                        }).join('');
                        sourcesHtml = `<div class="sources-section"><div class="sources-label">Sources:</div><div class="source-links">${sourceItems}</div></div>`;
                    }
                    const msgContent = streamingMsgEl.querySelector('.message-content');
                    msgContent.innerHTML = formatted + sourcesHtml;
                }
            }

            showTyping();

            try {
                const response = await fetch(`${API_BASE}/api/v1/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-ID': sessionId
                    },
                    body: JSON.stringify({ message: text }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    hideTyping();
                    if (handleAuthError(response)) return;
                    let errorMsg = `Server error (${response.status})`;
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.detail || errorData.error || errorMsg;
                    } catch (parseError) {
                        errorMsg = response.statusText || errorMsg;
                    }
                    addMessage(`Error: ${errorMsg}`, false);
                    statusDot.className = 'status-dot offline';
                    setTimeout(() => {
                        statusDot.className = 'status-dot';
                        statusText.textContent = 'Connected';
                    }, 3000);
                    sendBtn.disabled = false;
                    return;
                }

                let data;
                try {
                    data = await response.json();
                } catch (jsonErr) {
                    hideTyping();
                    console.error('Failed to parse response JSON:', jsonErr);
                    addMessage('Error: Server returned an invalid response. Please try again.', false);
                    sendBtn.disabled = false;
                    return;
                }
                hideTyping();

                // Remove old follow-up suggestions BEFORE adding new content.
                // They sit above the new message in the DOM, so removing them after
                // scrollToTopOfElement would shift content and invalidate the scroll position.
                const oldFollowUps = document.querySelector('.follow-up-suggestions');
                if (oldFollowUps) oldFollowUps.remove();

                // Handle new orchestration response format
                if (data.type === 'credit_report') {
                    const creditHtml = formatCreditReport(data);
                    addValidationMessage(creditHtml);
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'kyp_report') {
                    // Render comprehensive KYP due diligence report
                    const htmlContent = formatKYPReport(data);
                    addValidationMessage(htmlContent);

                    // Show follow-up suggestions if available
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'finops_report' || isFinOpsResponse(data.data || data)) {
                    // Render Finance Ops billing/collections dashboard
                    const finopsData = data.data || data;
                    const isBilling = data.task_type === 'billing_items' || finopsData.billing_items;
                    const isCollections = data.task_type === 'collections_items' || finopsData.collections_items;
                    finopsData.report_type = isCollections ? 'collections' : 'billing';
                    finopsData.task_type = data.task_type; // Pass task_type for proper title
                    const htmlContent = formatFinOpsReport(finopsData);
                    addValidationMessage(htmlContent);

                    // Show context-aware follow-up suggestions
                    let followUps = data.follow_up_suggestions || [];
                    if (followUps.length === 0) {
                        // Generate context-aware suggestions
                        if (isBilling) {
                            followUps = ['Show collections', 'Show overdue items', 'Show billing summary'];
                        } else if (isCollections) {
                            followUps = ['Show billing items', 'Show overdue only', 'Filter by customer'];
                        } else {
                            followUps = ['Show billing items', 'Show collections', 'Show overdue items'];
                        }
                    }
                    showFollowUpSuggestions(followUps);
                } else if (data.type === 'order_detail') {
                    const orderHtml = formatOrderDetailCard(data.order, data.sources || []);
                    addValidationMessage(orderHtml);
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'opportunity_report') {
                    const oppHtml = formatOpportunityCardsFromData(data);
                    addValidationMessage(oppHtml);
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'answer') {
                    const answer = data.answer || 'I processed your request.';
                    const sources = data.sources || [];
                    addMessage(answer, false, sources);

                    // Show follow-up suggestions if available
                    if (data.follow_up_suggestions && data.follow_up_suggestions.length > 0) {
                        showFollowUpSuggestions(data.follow_up_suggestions);
                    }
                } else if (data.type === 'clarification_needed') {
                    // Handle clarification requests
                    let clarificationMsg = 'I need a bit more information:\n';
                    if (data.questions && data.questions.length > 0) {
                        data.questions.forEach((q, i) => {
                            clarificationMsg += `\n${i + 1}. ${q.question || q}`;
                            if (q.options && q.options.length > 0) {
                                clarificationMsg += '\n   Options: ' + q.options.join(', ');
                            }
                        });
                    }
                    addMessage(clarificationMsg, false);
                } else if (data.type === 'entity_confirmation_needed') {
                    // Handle entity resolution confirmation with interactive cards
                    const candidates = data.candidates || [];
                    const query = data.query || '';

                    if (candidates.length > 0) {
                        // Build interactive entity selection UI
                        const originalTaskType = data.original_task_type || '';
                        const entityHtml = renderEntitySelection(candidates, query, data.message, originalTaskType);
                        addMessage(entityHtml, false, [], true); // true = isHtml
                    } else {
                        const confirmationMsg = data.message || 'No matching companies found. Please try a different name.';
                        addMessage(confirmationMsg, false);
                    }
                } else if (data.type === 'error') {
                    addMessage(`Error: ${data.error || 'Unknown error occurred'}`, false);
                } else if (data.success || data.status === 'completed') {
                    // Fallback for old response format
                    const result = data.result || {};
                    const summary = result.summary || result.response || result.result || 'I processed your request.';
                    const sources = result.sources || [];
                    addMessage(summary, false, sources);
                } else {
                    addMessage('I apologize, but I encountered an issue processing your request. Please try again.', false);
                }
            } catch (error) {
                clearTimeout(timeoutId);
                hideTyping();
                statusDot.className = 'status-dot offline';

                // Log the actual error for debugging
                console.error('Chat request failed:', error);
                console.error('Error name:', error.name);
                console.error('Error message:', error.message);
                console.error('Error stack:', error.stack);

                // Differentiate between timeout and other errors
                if (error.name === 'AbortError') {
                    statusText.textContent = 'Request timed out';
                    addMessage('The request is taking longer than expected. The AI agents may be processing complex data. Please try again or simplify your question.', false);
                } else {
                    statusText.textContent = 'Reconnecting...';
                    addMessage(`Connection error: ${error.message || 'Unknown error'}. Please try again.`, false);
                }

                setTimeout(() => {
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Connected';
                }, 3000);
            }

            sendBtn.disabled = false;
        }

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Send button, textarea keydown — event listeners (no inline handlers)
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keydown', handleKeyDown);

        // Load user profile, set avatar initials, and apply role-based UI
        (async function loadUserProfile() {
            const avatarEl = document.getElementById('avatarInitials');
            const avatarContainer = document.getElementById('userAvatar');

            try {
                const response = await fetch('/api/v1/auth/me', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    if (handleAuthError(response)) return;
                    console.warn('Auth check failed:', response.status);
                    avatarEl.textContent = '??';
                    return;
                }

                const data = await response.json();
                console.log('User data:', data);

                const user = data.user || data;
                const firstName = user.first_name || '';
                const fullName = user.full_name || user.username || 'User';
                const roles = user.roles || [];

                // Get initials from first_name (e.g., "Kian Seng" -> "KS")
                let initials;
                if (firstName) {
                    const parts = firstName.trim().split(/\s+/);
                    initials = parts.length >= 2
                        ? (parts[0][0] + parts[1][0]).toUpperCase()
                        : firstName.substring(0, 2).toUpperCase();
                } else {
                    // Fallback to full name
                    const parts = fullName.trim().split(/\s+/);
                    initials = parts.length >= 2
                        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
                        : fullName.substring(0, 2).toUpperCase();
                }

                avatarEl.textContent = initials;
                avatarContainer.title = fullName;
                console.log('Avatar set to:', initials);

                // Determine user role and apply role-based UI
                // Priority: financeops > sales_ops > default (sales_ops)
                let userRole = 'sales_ops';
                if (roles.includes('financeops')) {
                    userRole = 'financeops';
                } else if (roles.includes('sales_ops')) {
                    userRole = 'sales_ops';
                }

                console.log('User role detected:', userRole, 'from roles:', roles);
                applyRoleUI(userRole);

            } catch (error) {
                console.error('Failed to load user profile:', error);
                avatarEl.textContent = '!!';
            }
        })();

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                await fetch('/api/v1/auth/logout', { method: 'POST' });
            } catch (error) {
                console.error('Logout error:', error);
            }
            window.location.href = '/login';
        });
    </script>
</body>
</html>
