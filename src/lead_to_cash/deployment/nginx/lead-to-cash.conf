# Nginx configuration for Lead to Cash Application
# ==============================================================================
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Extended timeouts for LLM agent requests (which can take 60-180+ seconds)
# ==============================================================================

# Upstream configuration
upstream lead_to_cash_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name rr.kailash.ai;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rr.kailash.ai;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/rr.kailash.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rr.kailash.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/rr.kailash.ai/chain.pem;

    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (matches gateway middleware for consistency)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Logging
    access_log /var/log/nginx/lead-to-cash.access.log;
    error_log /var/log/nginx/lead-to-cash.error.log;

    # Security headers (AUTHORITATIVE SOURCE)
    # nginx is the only source of security headers in production.
    # The gateway does NOT set these headers in production to prevent duplicates.
    #
    # proxy_hide_header strips any headers from upstream (defense in depth)
    # in case development code accidentally sends them.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Request body size (for file uploads)
    client_max_body_size 50M;

    # ==========================================================================
    # Agent endpoints - Extended timeouts for LLM requests
    # ==========================================================================
    location /agent/ {
        proxy_pass http://lead_to_cash_backend;
        proxy_http_version 1.1;

        # Extended timeouts for LLM agent requests (can take 60-180+ seconds)
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffering settings for large responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ==========================================================================
    # Agent API endpoints - Extended timeouts for LLM requests
    # IMPORTANT: This must come BEFORE the general /api/ location block
    # ==========================================================================
    location /api/v1/agents/ {
        proxy_pass http://lead_to_cash_backend;
        proxy_http_version 1.1;

        # Extended timeouts for LLM agent requests (can take 60-180+ seconds)
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffering settings for large responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ==========================================================================
    # API endpoints - Standard timeouts
    # ==========================================================================
    location /api/ {
        proxy_pass http://lead_to_cash_backend;
        proxy_http_version 1.1;

        # Standard timeouts for API requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================================================
    # Health check endpoint
    # ==========================================================================
    location /health {
        proxy_pass http://lead_to_cash_backend;
        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # Default location - All other requests
    # ==========================================================================
    location / {
        proxy_pass http://lead_to_cash_backend;
        proxy_http_version 1.1;

        # Standard timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
